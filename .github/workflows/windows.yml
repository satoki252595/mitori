# Manual native Windows verification; the Nix-built executable supplies the Bun runtime too.
name: windows-native

on:
  workflow_call:
    inputs:
      verify_windows:
        description: "Run native Windows verification with the Nix-built executable"
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      verify_windows:
        description: "Run native Windows verification with the Nix-built executable"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  crossbuild:
    if: ${{ inputs.verify_windows }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop .#ci --command bun install --frozen-lockfile
      - run: nix develop .#windowsCross --command bun scripts/build-windows-job.ts
      - run: nix develop .#ci --command bun scripts/build-bin.ts --target windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-${{ github.sha }}
          include-hidden-files: true # Only the three explicit public executable/record paths below.
          path: |
            dist/mitori-windows-x64.exe
            node_modules/.cache/mitori-windows-job/windows-job-x64.exe
            node_modules/.cache/mitori-windows-job/windows-job-x64.json
          retention-days: 7

  native:
    needs: crossbuild
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-${{ github.sha }}
          path: .native-artifact
      - name: Native source tests with the Nix-built Bun runtime
        shell: pwsh
        run: |
          # Bun's standalone executable exposes its full CLI without another installation.
          $runtime = (Resolve-Path '.native-artifact/dist/mitori-windows-x64.exe').Path
          $env:BUN_BE_BUN = '1'
          & $runtime --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MITORI_WINDOWS_JOB_LAUNCHER = (Resolve-Path '.native-artifact/node_modules/.cache/mitori-windows-job/windows-job-x64.exe').Path
          $env:MITORI_BIN = $runtime
          & $runtime test packages/platform/src/spawn/windows-job.test.ts apps/cli/src/build/windows-job.test.ts apps/cli/src/commands/windows-bootstrap.test.ts 2>&1 | Tee-Object -FilePath windows-native-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime test packages/server/src/ws/manager.test.ts --test-name-pattern 'UXP-23: Windows' 2>&1 | Tee-Object -FilePath windows-native-tests.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime test packages/doc/src/store/safety.test.ts --test-name-pattern 'native doc paths' 2>&1 | Tee-Object -FilePath windows-native-tests.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiled Windows binary and embedded Workers
        shell: pwsh
        run: |
          $binary = '.native-artifact/dist/mitori-windows-x64.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary _selftest --json --elk-runs 1 | Tee-Object -FilePath windows-selftest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-evidence-${{ github.sha }}
          path: |
            windows-native-tests.log
            windows-selftest.json
          retention-days: 30
