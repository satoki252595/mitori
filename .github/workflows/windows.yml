# Manual native Windows verification only; the Nix exception needs explicit user approval.
name: windows-native

on:
  workflow_call:
    inputs:
      nix_exception_approved:
        description: "Explicit user approval for this run's Windows-only official Bun installation"
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      nix_exception_approved:
        description: "Explicit user approval for this Windows-only official Bun installation"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  crossbuild:
    if: ${{ inputs.nix_exception_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop .#ci --command bun install --frozen-lockfile
      - run: nix develop .#windowsCross --command bun scripts/build-windows-job.ts
      - run: nix develop .#ci --command bun scripts/build-bin.ts --target windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-${{ github.sha }}
          include-hidden-files: true # Only the three explicit public executable/record paths below.
          path: |
            dist/mitori-windows-x64.exe
            node_modules/.cache/mitori-windows-job/windows-job-x64.exe
            node_modules/.cache/mitori-windows-job/windows-job-x64.json
          retention-days: 7

  native:
    needs: crossbuild
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-${{ github.sha }}
          path: .native-artifact
      - name: Exact official Bun 1.4.2 (approved Windows Nix exception)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64.zip'
          Invoke-WebRequest 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ce4c17497b2f29712a99d3d53f028de28cd42e3bacb8589599e7f000e49b6405') { throw 'Bun archive integrity mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'mitori-bun'
          Expand-Archive $archive $runtime
          (Join-Path $runtime 'bun-windows-x64') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - run: bun install --frozen-lockfile
      - name: Native Job Object containment and verified extraction
        shell: pwsh
        run: |
          $env:MITORI_WINDOWS_JOB_LAUNCHER = (Resolve-Path '.native-artifact/node_modules/.cache/mitori-windows-job/windows-job-x64.exe').Path
          bun test packages/platform/src/spawn/windows-job.test.ts apps/cli/src/build/windows-job.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiled Windows binary and embedded Workers
        shell: pwsh
        run: |
          $binary = '.native-artifact/dist/mitori-windows-x64.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary _selftest --json --elk-runs 1 | Tee-Object -FilePath windows-selftest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-evidence-${{ github.sha }}
          path: windows-selftest.json
          retention-days: 30
