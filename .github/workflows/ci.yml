# PR gate (MILESTONES WP-00a 成果物 7 / §9): one GitHub-hosted ubuntu job, ≤ 10 min, `bun run ci:pr`.
# Triggers are pull_request and workflow_dispatch only (no push: keep Actions minutes for PRs).
# nightly / bench / contract run on the self-hosted Mac via schedule or dispatch in their own files (WP-12, WP-05).
# Actions are pinned to commit SHAs; the token is read-only.
name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_windows:
        description: "Run native Windows verification with the Nix-built executable"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The existing ci workflow can dispatch this branch's reusable workflow before it reaches main.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_windows }}
    uses: ./.github/workflows/windows.yml
    with:
      verify_windows: true

  pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Install (frozen lockfile; dependency lifecycle scripts never run, trustedDependencies = [])
        run: nix develop .#ci --command bun install --frozen-lockfile

      - name: ci:pr (check incl. budgets-merge --check + unit + fixtures --verify + golden + size)
        run: nix develop .#ci --command bun run ci:pr

      - name: Binary smoke (linux-x64)
        run: nix develop .#ci --command bash -c 'bun run build:bin && ./dist/mitori-linux-x64 --version'

  browsers:
    # Internal PRs only: a fork cannot execute code on the user's Mac.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, mitori-reference]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/nd bun install --frozen-lockfile
      - run: scripts/nd bunx playwright install chromium firefox webkit
      - name: Reader, map, large sections and IME in real browsers
        run: scripts/nd caffeinate -i bunx playwright test -c e2e/web/playwright.config.ts --project chromium --project firefox --project webkit
      - name: Encrypted shared viewer in Chromium, Firefox and WebKit
        run: MITORI_BROWSER_SHARE=1 scripts/nd bun test e2e/share/share.int.test.ts
      - name: Accessibility
        run: scripts/nd bun run e2e --grep @a11y
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browsers-${{ github.sha }}
          path: |
            e2e/test-results/
            test-results/
          retention-days: 30
