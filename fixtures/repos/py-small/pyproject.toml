[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsundoku"
version = "0.4.2"
description = "Keep track of the books you bought and have not read yet."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "click>=8.1",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tsundoku = "tsundoku.cli:main"
tsundoku-stats = "tsundoku.cli_click:cli"

[tool.setuptools.packages.find]
include = ["tsundoku*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
