<!doctype html><meta charset="utf-8"><title>driver</title>
<body style="margin:0"><script>
window.runAll = async (fws, rounds, reps = 9) => {
  const out = {}
  for (let r = 0; r < rounds; r++) {
    for (const fw of fws) {
      const f = document.createElement('iframe'); f.style.cssText = 'width:1200px;height:800px;border:0'
      document.body.append(f)
      await new Promise(res => { f.onload = res; f.src = fw + '/dist/index.html' })
      await new Promise(res => setTimeout(res, 300))
      const b = await f.contentWindow.__bench(reps)
      ;(out[fw] ??= []).push(b)
      f.remove()
      await new Promise(res => setTimeout(res, 300))
    }
  }
  return out
}
</script></body>
<script>
window.runVirt = async (fws, rounds) => {
  const out = {}
  for (let r = 0; r < rounds; r++) for (const fw of fws) {
    const f = document.createElement('iframe'); f.style.cssText = 'width:1200px;height:800px;border:0'; document.body.append(f)
    await new Promise(res => { f.onload = res; f.src = fw + '/dist/index.html' }); await new Promise(res => setTimeout(res, 300))
    ;(out[fw] ??= []).push(await f.contentWindow.__benchVirt(300)); f.remove(); await new Promise(res => setTimeout(res, 200))
  }
  return out
}
</script>
