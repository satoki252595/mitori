<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>crit — 見取り図 mitori</title>
<script>
/* head inline: restore theme / lang / level / rail before first paint (CLS 0). Real app: `mitori_ui` cookie. */
(function(){try{var u=JSON.parse(localStorage.getItem('mitori_ui')||'{}');var h=location.hash;var m=function(k){var r=new RegExp('[#&]'+k+'=([^&]+)').exec(h);return r?decodeURIComponent(r[1]):null};
var t=m('theme')||u.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
var l=m('lang')||u.lang;if(l==='en')document.documentElement.lang='en';
var lv=m('level')||u.level||'standard';document.documentElement.setAttribute('data-level',lv);
if(u.rail===false)document.documentElement.setAttribute('data-rail','off');}catch(e){document.documentElement.setAttribute('data-level','standard')}})();
</script>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI","Yu Gothic UI",Meiryo,"Noto Sans JP","Noto Sans CJK JP",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono","BIZ UDGothic","Noto Sans Mono CJK JP",monospace;
  --bg:#f4f3ef; --bg-grid:rgba(52,60,78,.07); --bg-grid2:rgba(52,60,78,.035);
  --surface:#ffffff; --surface-2:#faf9f6; --surface-3:#f1efe9; --surface-4:#e9e6de;
  --ink:#1b1d22; --ink-2:#454a54; --ink-3:#6f7581; --ink-4:#9ba0a9;
  --line:#e4e1d9; --line-2:#d5d1c6; --wall:#2b2e35; --wall-2:#5b606b;
  --accent:#2f4fbf; --accent-ink:#22409f; --accent-tint:#e8ecfa; --accent-tint-2:#d6defa;
  --shu:#d1491a; --shu-tint:#fcebe3;
  --ai:#6a45dc; --ai-tint:#efe9fd; --ai-ink:#5531c4;
  --ok:#2b8a3e; --ok-tint:#e5f4e8; --ok-flash:rgba(43,138,62,.18);
  --warn:#9a6200; --warn-tint:#fff3d1; --warn-line:#e8b54a;
  --err:#c42b2b; --err-tint:#fdeaea;
  --add-bg:#e4f5e8; --add-hl:#bfe8c9; --add-ink:#17602b; --del-bg:#fde9e9; --del-hl:#f6c4c4; --del-ink:#9c1f1f;
  --code-bg:#f2f0ea; --code-ink:#2a2d33;
  --tk-k:#a6216b; --tk-s:#1f6d37; --tk-c:#7f8590; --tk-n:#9a4b00; --tk-f:#2b4fb8; --tk-t:#7a3fb0;
  --z1:#e9f0fb; --z1h:#dde8f9; --z2:#f5efe2; --z2h:#efe6d3; --z3:#f7eaee; --z3h:#f2dde4; --z4:#e6f3ec; --z4h:#d8ecdf; --zn:#ecebe7;
  --door-gap:#faf9f6;
  --shadow-1:0 1px 2px rgba(20,24,32,.06),0 1px 1px rgba(20,24,32,.04);
  --shadow-2:0 8px 24px -8px rgba(20,24,32,.18),0 2px 6px rgba(20,24,32,.06);
  --shadow-3:0 24px 60px -12px rgba(20,24,32,.28),0 6px 16px rgba(20,24,32,.08);
  --r:8px; --rail-w:228px; --sheet-w:600px; --top-h:48px; --status-h:28px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --bg-grid:rgba(190,200,225,.06); --bg-grid2:rgba(190,200,225,.028);
  --surface:#161920; --surface-2:#1a1d24; --surface-3:#21252e; --surface-4:#2a2f3a;
  --ink:#e7e9ed; --ink-2:#b9bec8; --ink-3:#8c93a0; --ink-4:#666d79;
  --line:#272b34; --line-2:#343a46; --wall:#c4cad5; --wall-2:#8e95a2;
  --accent:#8ea3ff; --accent-ink:#b3c1ff; --accent-tint:rgba(142,163,255,.13); --accent-tint-2:rgba(142,163,255,.22);
  --shu:#ff8a5b; --shu-tint:rgba(255,138,91,.14);
  --ai:#a68fff; --ai-tint:rgba(166,143,255,.14); --ai-ink:#c2b3ff;
  --ok:#5ec97b; --ok-tint:rgba(94,201,123,.13); --ok-flash:rgba(94,201,123,.22);
  --warn:#f0b94e; --warn-tint:rgba(240,185,78,.12); --warn-line:#a37a26;
  --err:#ff7070; --err-tint:rgba(255,112,112,.12);
  --add-bg:rgba(94,201,123,.11); --add-hl:rgba(94,201,123,.28); --add-ink:#8fe0a5; --del-bg:rgba(255,112,112,.10); --del-hl:rgba(255,112,112,.28); --del-ink:#ffa3a3;
  --code-bg:#1d2129; --code-ink:#d9dde4;
  --tk-k:#ff7ab6; --tk-s:#86d39b; --tk-c:#7d8592; --tk-n:#f0b46a; --tk-f:#8fb0ff; --tk-t:#c9a2ff;
  --z1:#162030; --z1h:#1b273a; --z2:#211d15; --z2h:#28231a; --z3:#25171c; --z3h:#2d1c22; --z4:#13231b; --z4h:#182b21; --zn:#1b1c1f;
  --door-gap:#1a1d24;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px -8px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); --shadow-3:0 24px 60px -12px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --bg-grid:rgba(190,200,225,.06); --bg-grid2:rgba(190,200,225,.028);
  --surface:#161920; --surface-2:#1a1d24; --surface-3:#21252e; --surface-4:#2a2f3a;
  --ink:#e7e9ed; --ink-2:#b9bec8; --ink-3:#8c93a0; --ink-4:#666d79;
  --line:#272b34; --line-2:#343a46; --wall:#c4cad5; --wall-2:#8e95a2;
  --accent:#8ea3ff; --accent-ink:#b3c1ff; --accent-tint:rgba(142,163,255,.13); --accent-tint-2:rgba(142,163,255,.22);
  --shu:#ff8a5b; --shu-tint:rgba(255,138,91,.14);
  --ai:#a68fff; --ai-tint:rgba(166,143,255,.14); --ai-ink:#c2b3ff;
  --ok:#5ec97b; --ok-tint:rgba(94,201,123,.13); --ok-flash:rgba(94,201,123,.22);
  --warn:#f0b94e; --warn-tint:rgba(240,185,78,.12); --warn-line:#a37a26;
  --err:#ff7070; --err-tint:rgba(255,112,112,.12);
  --add-bg:rgba(94,201,123,.11); --add-hl:rgba(94,201,123,.28); --add-ink:#8fe0a5; --del-bg:rgba(255,112,112,.10); --del-hl:rgba(255,112,112,.28); --del-ink:#ffa3a3;
  --code-bg:#1d2129; --code-ink:#d9dde4;
  --tk-k:#ff7ab6; --tk-s:#86d39b; --tk-c:#7d8592; --tk-n:#f0b46a; --tk-f:#8fb0ff; --tk-t:#c9a2ff;
  --z1:#162030; --z1h:#1b273a; --z2:#211d15; --z2h:#28231a; --z3:#25171c; --z3h:#2d1c22; --z4:#13231b; --z4h:#182b21; --zn:#1b1c1f;
  --door-gap:#1a1d24;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px -8px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3); --shadow-3:0 24px 60px -12px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:14px;height:14px}.ico.xs{width:12px;height:12px}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;font:500 10.5px/1 var(--font-mono);color:var(--ink-3);background:var(--surface)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr) var(--status-h)}
.top{display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;min-width:0;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand .mk{width:22px;height:22px;color:var(--ink)}
.brand small{font:500 10.5px/1 var(--font-mono);color:var(--ink-3);letter-spacing:0}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden}
.crumbs .sep{color:var(--ink-4)}
.crumbs .repo{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-3)}
.crumbs .repo .br{font:500 11px var(--font-mono);color:var(--ink-3);font-weight:400}
.crumbs .cur{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;margin:0 8px;flex:none;padding:3px;background:var(--surface-3);border-radius:9px}
.tab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:7px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.tab .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--shu);color:#fff;font:600 10.5px/18px var(--font-sans);text-align:center}
.tright{display:flex;align-items:center;gap:4px;flex:none}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.seg button{height:24px;padding:0 9px;border-radius:6px;color:var(--ink-3);font-size:12px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lvwrap{display:flex;align-items:center;gap:6px}
.lvwrap .hint{display:flex;gap:2px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:7px;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{background:var(--surface-3);color:var(--ink)}
.search{border:1px solid var(--line);background:var(--surface-2);width:118px;justify-content:space-between;color:var(--ink-3)}
.usage{white-space:nowrap;font:500 11.5px/1 var(--font-sans);color:var(--ink-3);padding:0 8px;height:30px;display:inline-flex;align-items:center;gap:6px;border-left:1px solid var(--line);margin-left:2px}
.usage b{color:var(--ink-2);font-weight:600}
.meter{width:34px;height:5px;border-radius:3px;background:var(--surface-4);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}

.main{position:relative;overflow:clip;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0}
:root[data-rail="off"] .main{grid-template-columns:0 minmax(0,1fr)}
.rail{min-height:0;overflow:hidden auto;background:var(--surface-2);border-right:1px solid var(--line);scrollbar-width:thin}
:root[data-rail="off"] .rail{visibility:hidden}
.stage{position:relative;min-width:0;min-height:0;overflow:clip}
.status{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--surface);border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;z-index:20}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;vertical-align:1px}
.status .mid{margin:0 auto;color:var(--ink-2);display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis}
.status .sp{display:flex;align-items:center;gap:6px}
.status b{font-weight:600;color:var(--ink-2)}
.protobtn{height:20px;padding:0 7px;border-radius:5px;border:1px dashed var(--line-2);font-size:10.5px;color:var(--ink-3)}
:root.clean .protobtn{display:none}

/* ---------- rail ---------- */
.proj{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.proj h3{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.proj .sub{color:var(--ink-3);font-size:11.5px}
.langbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:9px 0 6px;background:var(--surface-4)}
.langbar i{display:block;height:100%}
.langleg{display:flex;gap:10px;font-size:11px;color:var(--ink-3)}
.langleg span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;background:var(--c)}
.cov{margin-top:8px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.cov b{color:var(--ink-2);font-weight:600}
.pathbox{margin:12px 12px 4px;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;align-items:center;gap:10px}
.ring{--p:0;width:34px;height:34px;flex:none;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-4) 0);display:grid;place-items:center}
.ring::after{content:attr(data-t);width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 10.5px/1 var(--font-sans);color:var(--ink-2)}
.pathbox .pt{font-size:12.5px;font-weight:600}
.pathbox .ps{font-size:11px;color:var(--ink-3)}
.pathsel{margin-left:auto;color:var(--ink-3)}
.toch{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.06em}
.toc{list-style:none;margin:0;padding:0 6px 16px}
.toc li{margin:0}
.ti{display:flex;align-items:center;gap:6px;width:100%;min-height:27px;padding:3px 8px;border-radius:6px;text-align:left;color:var(--ink-2);font-size:12.5px}
.ti:hover{background:var(--surface-3);color:var(--ink)}
.ti .n{font:500 11px var(--font-mono);color:var(--ink-4);min-width:26px}
.ti .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .tm{font-size:10.5px;color:var(--ink-4);white-space:nowrap}
.ti.sub{padding-left:22px}
.ti.cur{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.ti.cur .n{color:var(--accent)}
.ti.inpath .tt::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px;opacity:.65}
.ti.visited .tt::after{background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:3px;height:17px;padding:0 6px;border-radius:9px;font:500 10px/1 var(--font-sans);white-space:nowrap}
.pill.st{background:var(--surface-4);color:var(--ink-2)}
.pill.gen{background:var(--ai-tint);color:var(--ai-ink)}
.pill.ng{color:var(--ink-4);border:1px dashed var(--line-2)}
.pill.stale{background:var(--warn-tint);color:var(--warn)}
.ti .gdot{width:7px;height:7px;border-radius:50%;background:var(--ai);animation:breathe 1.2s ease-in-out infinite}
.minimap{margin:10px 12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;display:none}
.minimap svg{display:block;width:100%;height:auto}
.minimap .mr{fill:var(--surface-3);stroke:var(--wall-2);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.minimap .mr.on{fill:var(--accent-tint-2);stroke:var(--accent);stroke-width:1.6}
.minimap text{font:500 9px var(--font-sans);fill:var(--ink-3);pointer-events:none}
.view-doc .minimap{display:block}

/* ---------- map ---------- */
.mapwrap{position:absolute;inset:0;overflow:clip}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
#map text{font-family:var(--font-sans)}
.gridbg{fill:url(#grid)}
.floor{fill:var(--zf);transition:fill .18s,opacity .25s}
.room{cursor:pointer;outline:none}
.room:hover .floor{fill:var(--zfh)}
.room.sel .floor{fill:var(--accent-tint)}
.has-sel .room:not(.sel):not(.nb) .floor{opacity:.5}
:root[data-theme="dark"] .has-sel .room:not(.sel):not(.nb) .floor{opacity:.72}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .has-sel .room:not(.sel):not(.nb) .floor{opacity:.72}}
.has-sel .rlw:not(.sel):not(.nb) .rl{opacity:.55}
.heat{fill:var(--shu);opacity:0;pointer-events:none;transition:opacity .25s}
.ov-churn .heat{opacity:calc(var(--h) * .34)}
.wall{fill:none;stroke:var(--wall);stroke-width:2;vector-effect:non-scaling-stroke;transition:opacity .25s;pointer-events:none}
.bldg{fill:none;stroke:var(--wall);stroke-width:4;vector-effect:non-scaling-stroke;pointer-events:none}
.cont{fill:none;stroke:var(--wall);stroke-width:3.5;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .25s;pointer-events:none}
.door .gap{stroke:var(--door-gap);stroke-width:6;vector-effect:non-scaling-stroke}
.door .leaf{stroke:var(--wall);stroke-width:1.5;vector-effect:non-scaling-stroke}
.door .arc{fill:none;stroke:var(--wall-2);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.door{transition:opacity .25s;pointer-events:none}
.hatch{fill:url(#hatch);pointer-events:none}
.selr{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.flashr{fill:var(--ok);opacity:0;pointer-events:none}
.flashr.go{animation:mflash .9s ease-out 1}
@keyframes mflash{0%{opacity:.35}100%{opacity:0}}
.airing{fill:none;stroke:var(--ai);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-dasharray:7 6;animation:march .9s linear infinite;pointer-events:none}
@keyframes march{to{stroke-dashoffset:-26}}
.stalering{fill:none;stroke:var(--warn-line);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:3 4;pointer-events:none;opacity:0;transition:opacity .2s}
.ov-fresh .stalering{opacity:1}
.genshim{fill:var(--ai);opacity:.0;pointer-events:none}
.genshim.on{animation:shim 1.4s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.04}50%{opacity:.16}}
.rl{transition:opacity .2s}
.rl .rn{font-size:13px;font-weight:600;fill:var(--ink)}
.rl .rp{font:400 11px var(--font-mono);fill:var(--ink-3)}
.rl .rs{font-size:10.5px;fill:var(--ink-3)}
.rl .rx{font-size:10.5px;fill:var(--ink-3)}
.rl .rb text{font-size:10px;fill:var(--ink-3)}
.rl .rf{display:none}
.rl .rf .fn{font:500 11.5px var(--font-mono);fill:var(--ink-2)}
.rl .rf .fl{font:400 10.5px var(--font-sans);fill:var(--ink-4)}
.rl .rf .fs{font:400 10.5px var(--font-mono);fill:var(--ai-ink)}
.rl .rf .fb{fill:var(--wall-2);opacity:.35}
.rl .rf rect.fbox{fill:var(--surface);stroke:var(--line-2);stroke-width:1;rx:4}
.rl.xs .rp,.rl.xs .rs,.rl.xs .rb,.rl.xs .rn.l{display:none}.rl .rn.s{display:none}.rl.xs .rn.s{display:inline;font-size:11.5px}.rl.sn .rn.l{display:none}.rl.sn .rn.s{display:inline}
.rl.sm .rs,.rl.sm .rb{display:none}
.rl.xxs{display:none}
.rl.lg .rf{display:inline}
.rl.lg .rx{display:none}
.verbar{fill:var(--ok)}.verbar.bg{fill:var(--surface-4)}
.clbl,.blbl{opacity:0;transition:opacity .25s;pointer-events:none}
.clbl .cn{font-size:16px;font-weight:600;fill:var(--ink)}
.clbl .cs{font-size:11.5px;fill:var(--ink-3)}
.blbl .bn{font-size:22px;font-weight:600;fill:var(--ink)}
.blbl .bs{font-size:12px;fill:var(--ink-3)}
.z1 .rl,.z0 .rl{opacity:0!important}
.z1 .wall,.z0 .wall{opacity:.16}
.z1 .cont{opacity:1}
.z1 .clbl{opacity:1}
.z1 .door,.z0 .door{opacity:0}
.z0 .floor{opacity:.5}

.gcard .gt{font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.gcard .gy{font-size:12px;color:var(--ink-3);font-weight:400}
.gcard .ge{font:500 11.5px var(--font-mono);color:var(--ink-3)}
.gcard p{margin:6px 0 8px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.gcard .gf{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
.ccard{width:320px;padding:12px 14px;font-size:12.5px;line-height:1.65}
.ccard h5{margin:0 0 4px;font-size:13px}
.ccard .acts{display:flex;gap:6px;margin-top:10px}

/* ---------- selection toolbar ---------- */
.seltb{position:fixed;z-index:55;display:flex;gap:2px;padding:4px;border-radius:10px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-2);opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;pointer-events:none}
.seltb.on{opacity:1;transform:none;pointer-events:auto}
.seltb button{height:28px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--surface)}
.seltb button:hover{background:rgba(255,255,255,.14)}
:root[data-theme="dark"] .seltb button:hover{background:rgba(0,0,0,.1)}
.seltb kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.55;height:16px;min-width:16px}
::highlight(mitori-quote){background-color:var(--accent-tint-2)}
.qmark{background:var(--accent-tint-2);border-radius:3px;box-shadow:0 0 0 1px var(--accent-tint-2)}

/* ---------- composer & job card ---------- */
.float{position:absolute;left:14px;right:14px;z-index:7}
.composer{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-3);overflow:hidden;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.cp-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;font-size:12px;color:var(--ink-3)}
.cp-h b{color:var(--ink);font-weight:600;font-size:13px}
.cp-h .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.cp-q{margin:0 14px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 6px 6px 0;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-height:62px;overflow:hidden}
.intents{display:flex;gap:6px;padding:10px 14px 0}
.intent{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.intent kbd{height:15px;min-width:15px;font-size:9.5px;border-bottom-width:1px}
.intent[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.intent[aria-pressed="true"] kbd{color:inherit;border-color:currentColor;background:transparent;opacity:.6}
.cp-ta{display:block;width:calc(100% - 28px);margin:10px 14px 0;min-height:52px;max-height:180px;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:14px/1.7 var(--font-sans);color:var(--ink);background:var(--surface)}
.cp-ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.twoway{display:flex;gap:6px;padding:8px 14px 0;font-size:12px;color:var(--ink-3);align-items:center;flex-wrap:wrap}
.twoway label{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line);cursor:pointer;color:var(--ink-2)}
.twoway input{accent-color:var(--accent);margin:0}
.twoway label:has(input:checked){border-color:var(--accent);background:var(--accent-tint);color:var(--accent-ink)}
.ctx{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0;align-items:center}
.ctx .lbl{font-size:11px;color:var(--ink-3);margin-right:2px}
.cchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 3px 0 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);font:500 11px var(--font-mono);color:var(--ink-2);transition:opacity .15s}
.cchip .tk{font:500 10.5px var(--font-sans);color:var(--ink-3)}
.cchip .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--ink-4)}
.cchip .x:hover{background:var(--surface-4);color:var(--ink)}
.cchip.sugg{border-style:dashed;background:transparent;color:var(--ink-3);padding-right:9px}
.cchip.sec{font-family:var(--font-sans)}
.cp-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:10px 14px 12px;margin-top:12px;border-top:1px solid var(--line);background:var(--surface-2)}
.cp-f .est{flex:1 1 100%}
.est{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);position:relative}
.est .b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);display:inline-block;min-width:54px}
.est .band{width:8px;height:8px;border-radius:50%;background:var(--ink-4)}
.est .dim{color:var(--ink-3)}
.eng{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);background:var(--surface)}
.eng .bolt{color:var(--ai)}
.cp-f .sp{margin-left:auto;display:flex;gap:6px}
.estpop{position:absolute;bottom:calc(100% + 10px);left:-6px;width:300px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:11.5px;line-height:1.7;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.est:hover .estpop,.est:focus-within .estpop{opacity:1}
.estpop table{width:100%;border-collapse:collapse}.estpop td{padding:0}.estpop td.r{text-align:right;font-variant-numeric:tabular-nums}
.estpop hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:5px 0}
.job{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-2);overflow:hidden;animation:pop .12s var(--ease)}
.job.run{border-color:color-mix(in srgb,var(--ai) 45%,var(--line-2))}
.job.ready{border-color:color-mix(in srgb,var(--ai) 60%,var(--line-2))}
.job.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line-2))}
.jb-h{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.jb-h .st{font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.jb-h .sp{margin-left:auto;font-variant-numeric:tabular-nums}
.sglyph{width:14px;height:14px;flex:none;display:inline-grid;place-items:center}
.sglyph.run{border-radius:50%;border:2px solid var(--ai);border-right-color:transparent;animation:spin .9s linear infinite;width:13px;height:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.sglyph.q{border-radius:50%;border:1.5px solid var(--ink-4);width:11px;height:11px}
.sglyph.ok{color:var(--ok)}.sglyph.err{color:var(--err)}.sglyph.prop{color:var(--ai)}
.stages{list-style:none;margin:0;padding:8px 14px 4px}
.stages li{display:grid;grid-template-columns:18px 104px 1fr auto;align-items:center;gap:6px;min-height:24px;font-size:12px;color:var(--ink-2)}
.stages li.pend{color:var(--ink-4)}
.stages li .d{font:400 11.5px var(--font-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stages li .t{font:400 11px var(--font-mono);color:var(--ink-4);font-variant-numeric:tabular-nums}
.tail{margin:2px 14px 8px;padding:6px 9px;border-radius:7px;background:var(--code-bg);font:11.5px var(--font-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jb-f{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--ink-3)}
.jb-f .sp{margin-left:auto;display:flex;gap:6px}
.sum{margin:0;padding:10px 14px 4px 32px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.sum li{margin:2px 0}
.gates{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 0}
.gate{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:12px;background:var(--ok-tint);color:var(--ok);font:500 11.5px var(--font-mono)}
.gate .tm{color:var(--ink-3);font-family:var(--font-sans);font-size:10.5px}
.costline{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 14px;font-size:12px;color:var(--ink-3)}
.costline b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.diffsum{display:flex;gap:10px;padding:8px 14px 0;font-size:12px;color:var(--ink-2);align-items:center}
.plus{color:var(--add-ink);font:600 12px var(--font-mono)}.minus{color:var(--del-ink);font:600 12px var(--font-mono)}
.jdone{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.jdone b{flex:none}.jdone .ds{overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink-3)}
.jdone .sp{margin-left:auto}

/* ---------- review overlay ---------- */
.review{position:absolute;top:12px;left:12px;bottom:12px;right:calc(var(--sheet-w) + 12px);z-index:9;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-3);display:none;flex-direction:column;overflow:hidden;animation:pop .16s var(--ease)}
.review.on{display:flex}
.scrim{position:absolute;inset:0;z-index:8;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(1.5px);display:none}
.scrim.on{display:block}
.rv-h{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.rv-h .r1{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.rv-h .r1 .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.rvmap{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-right:6px}.rvmap svg{width:64px;height:auto;border-radius:4px}.rvmap .mr{stroke:var(--wall-2);stroke-width:1;vector-effect:non-scaling-stroke}
.rv-h h2{margin:4px 0 8px;font-size:17px;font-weight:600}
.rv-b{flex:1;min-height:0;overflow:auto;padding:14px 18px 20px;scrollbar-width:thin}
.rv-whole{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:var(--surface-2)}
.rv-whole.focus,.dfile .hk.focus{outline:2px solid var(--accent);outline-offset:-1px}
.rv-whole .sp{margin-left:auto;display:flex;gap:6px}
.dfile{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.dfile .fh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font:600 12px var(--font-mono)}
.dfile .fh .sp{margin-left:auto;display:flex;gap:8px;align-items:center;font-family:var(--font-sans)}
.hk{position:relative}
.hk+.hk{border-top:1px solid var(--line)}
.hk .hh{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;padding:4px 10px 4px 12px;background:var(--accent-tint);font:500 11.5px var(--font-mono);color:var(--accent-ink)}
.hk .hh .fnn{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.hk .hh .sp{margin-left:auto;display:flex;gap:4px;font-family:var(--font-sans);flex:none}
.hk.acc .hh{background:var(--ok-tint);color:var(--ok)}
.hk.rej .hh{background:var(--err-tint);color:var(--err)}
.hk.rej .dl{opacity:.45}
.dl{display:grid;grid-template-columns:44px 44px 16px 1fr;font:12px/1.65 var(--font-mono);font-variant-ligatures:none;white-space:pre}
.dl>span{overflow:hidden}
.dl .o,.dl .n{color:var(--ink-4);text-align:right;padding-right:8px;user-select:none}
.dl .m{color:var(--ink-4);user-select:none;text-align:center}
.dl.add{background:var(--add-bg)}.dl.add .m{color:var(--add-ink)}
.dl.del{background:var(--del-bg)}.dl.del .m{color:var(--del-ink)}
.dl.add mark{background:var(--add-hl);color:inherit;border-radius:2px}
.dl.del mark{background:var(--del-hl);color:inherit;border-radius:2px}
.dl .tx{padding-right:12px;color:var(--code-ink)}
.rv-f{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--ink-3)}
.rv-f .sp{margin-left:auto;display:flex;gap:8px}

/* ---------- overview (first run) ---------- */
.ovw h2{margin:0 0 2px;font-size:17px;font-weight:600}
.scanl{list-style:none;margin:10px 0 16px;padding:0;font-size:12px}
.scanl li{display:grid;grid-template-columns:18px 58px 1fr auto;gap:6px;align-items:center;min-height:22px;color:var(--ink-2)}
.scanl .k{font:600 11px var(--font-mono);color:var(--ink-3)}
.scanl .t{font:400 11px var(--font-mono);color:var(--ink-4)}
.estc{border:1px solid var(--line-2);border-radius:14px;padding:14px;background:var(--surface);box-shadow:var(--shadow-2);margin-bottom:18px;position:relative}
.estc h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.estc .lead{font-size:12px;color:var(--ink-3);margin:2px 0 12px}
.effort{display:grid;gap:6px}
.eff{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:2px 8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;text-align:left;background:var(--surface-2);transition:border-color .12s}
.eff .rad{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-4);grid-row:1/3}
.eff[aria-pressed="true"] .rad{border:4.5px solid var(--ink)}
.eff .es{grid-column:2/4}
.eff:hover{border-color:var(--ink-3)}
.eff[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink)}
.eff .en{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.eff .rec{font-size:10px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:1px 5px;border-radius:4px}
.eff .ev{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.eff .es{font-size:11px;color:var(--ink-3);line-height:1.45}
.estline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.estline .big{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.estline .sp{margin-left:auto}
.engrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.engopt{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line);color:var(--ink-2)}
.engopt[aria-pressed="true"]{border-color:var(--ink-2);color:var(--ink);background:var(--surface-3)}
.ovh{margin:4px 0 8px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.05em}
.effseg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.effseg button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 9px;border-radius:8px;text-align:left}
.effseg button[aria-checked="true"]{background:var(--surface);box-shadow:var(--shadow-1),0 0 0 1px var(--ink)}
.effseg .en{font-size:12.5px;font-weight:600;display:flex;gap:5px;align-items:center}
.effseg .rec{font-size:9.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:1px 4px;border-radius:4px}
.effseg .ev{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.effsub{font-size:11px;color:var(--ink-3);margin:6px 2px 0}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 16px}
.fc{display:flex;flex-direction:column;gap:1px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 10px 8px;text-align:left;background:var(--surface);transition:border-color .12s}
.fc:hover{border-color:var(--ink-3)}
.fc b{font-size:18px;font-weight:600;line-height:1.25}
.fc .fl{font-size:11.5px;color:var(--ink-2);font-weight:500}
.fc .fx{font-size:10px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estline .big{flex:1 1 100%}.estline .esub{flex:1 1 100%;font-size:11px;color:var(--ink-3);line-height:1.55;margin-top:-6px}.estline .esub2{font-size:11px;color:var(--ink-3);margin-right:auto}
.disc{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.6}
.disc a{color:var(--accent-ink)}
.sessbox{display:none;margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--code-bg);font:11.5px/1.7 var(--font-mono);color:var(--code-ink);white-space:pre-wrap}
.sessbox.on{display:block}
.factgrid{display:grid;gap:12px}
.zero{display:inline-flex;align-items:center;gap:4px;font:600 10px/1 var(--font-sans);color:var(--ok);background:var(--ok-tint);padding:3px 6px;border-radius:9px}
.genlist{list-style:none;margin:8px 0 0;padding:0;font-size:12px}
.genlist li{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;min-height:24px;color:var(--ink-2)}
.genlist .d{font:11px var(--font-mono);color:var(--ink-4)}

/* ---------- doc view ---------- */
.docview{position:absolute;inset:0;display:none;grid-template-columns:minmax(0,1fr) 380px;background:var(--surface)}
.view-doc .docview{display:grid}
.view-doc .mapwrap,.view-doc .sheet{visibility:hidden}
.docscroll{overflow:auto;min-height:0;scrollbar-width:thin;position:relative}
.docinner{max-width:calc(40em + 80px);margin:0 auto;padding:28px 40px 80px;position:relative}
.covbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--ink-3);margin-bottom:22px}
.covbar b{color:var(--ink-2)}
.ctxpane{border-left:1px solid var(--line);background:var(--surface-2);overflow:auto;min-height:0;padding:14px}
.ctxpane h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;color:var(--ink-3)}
.ctxcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}

/* ---------- inbox ---------- */
.inboxview{position:absolute;inset:0;display:none;grid-template-columns:minmax(0,1fr) 520px;background:var(--surface)}
.view-inbox .inboxview{display:grid}
.view-inbox .mapwrap,.view-inbox .sheet{visibility:hidden}
.ib-l{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.ib-h{padding:16px 20px 10px}
.ib-h h2{margin:0 0 10px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.ib-h h2 small{font-size:12px;color:var(--ink-3);font-weight:400}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.flt{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.flt .c{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.flt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flt[aria-pressed="true"] .c{color:inherit;opacity:.7}
.ib-list{flex:1;min-height:0;overflow:auto;padding:4px 10px 10px;scrollbar-width:thin}
.ibgrp{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;padding:12px 10px 6px}
.ibi{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.ibi:hover{background:var(--surface-2)}
.ibi.cur{background:var(--accent-tint);border-color:var(--accent-tint-2)}
.ibi .g1{grid-row:1/3;padding-top:2px}
.ibi .tt{font-size:13.5px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibi .sb{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.ibi .rt{font-size:11px;color:var(--ink-4);white-space:nowrap;text-align:right}
.anc{font:500 11px var(--font-mono);color:var(--ink-2);background:var(--surface-3);padding:1px 6px;border-radius:4px}
.stl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.stl.run{color:var(--ai-ink)}.stl.prop{color:var(--ai-ink)}.stl.q{color:var(--ink-3)}.stl.err{color:var(--err)}.stl.out{color:var(--warn)}.stl.ok{color:var(--ok)}.stl.me{color:var(--shu)}.stl.draft{color:var(--ink-3)}
.batch{display:flex;align-items:center;gap:10px;margin:8px 10px 10px;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:12.5px}
.batch .sp{margin-left:auto}
.batch .sv{color:#8be0a0;font-weight:600}
:root[data-theme="dark"] .batch .sv{color:#2b8a3e}
.batch .btn{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.ib-d{overflow:auto;min-height:0;padding:18px 20px;scrollbar-width:thin;background:var(--surface-2)}
.ib-d h3{margin:6px 0 6px;font-size:16px;font-weight:600;line-height:1.45}
.tline{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1.5px;background:var(--line-2)}
.tline li{position:relative;padding:0 0 14px 32px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.tline .av{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--font-sans);background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink-3)}
.tline .av.ai{border-color:var(--ai);color:var(--ai-ink)}
.tline .av.me{border-color:var(--shu);color:var(--shu)}
.tline .who{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.tline .who b{color:var(--ink);font-weight:600}
.tline .bub{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.failbox{background:var(--err-tint);border-radius:10px;padding:9px 11px;font:11.5px/1.6 var(--font-mono);color:var(--err);white-space:pre-wrap;margin-top:6px}

/* ---------- palette ---------- */
.pal-scrim{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--ink) 18%,transparent);display:none}
.pal-scrim.on{display:block}
.palette{position:fixed;z-index:71;top:12vh;left:50%;width:min(660px,calc(100vw - 32px));transform:translateX(-50%) scale(.985);opacity:0;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-3);overflow:hidden;transition:opacity .15s,transform .15s}
.palette.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.pal-i{display:flex;align-items:center;gap:10px;padding:0 16px;height:54px;border-bottom:1px solid var(--line)}
.pal-i input{flex:1;border:0;background:none;font:16px var(--font-sans);color:var(--ink);outline:none;height:100%}
.pal-i input::placeholder{color:var(--ink-4)}
.pal-l{max-height:min(470px,62vh);overflow:auto;padding:6px;scrollbar-width:thin}
.pal-g{font-size:10.5px;font-weight:600;color:var(--ink-4);letter-spacing:.06em;padding:9px 10px 4px}
.pal-o{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:9px;cursor:pointer}
.pal-o.act{background:var(--accent-tint)}
.pal-o .oi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.pal-o .ol{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-o .ol mark{background:none;color:var(--accent-ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--accent-tint-2);text-underline-offset:3px}
.pal-o .os{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-o .os mark{background:var(--accent-tint-2);color:var(--ink);border-radius:2px}
.pal-o .om{font:500 11px var(--font-mono);color:var(--ink-4);white-space:nowrap}
.pal-f{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);background:var(--surface-2)}
.pal-f span{display:inline-flex;align-items:center;gap:5px}
.pal-e{padding:22px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- toasts, help ---------- */
.toasts{position:fixed;left:50%;bottom:calc(var(--status-h) + 16px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:320px;max-width:720px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-3);font-size:12.5px;position:relative;overflow:hidden;animation:tin .18s var(--ease)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast .ok{color:#7ddc93}
:root[data-theme="dark"] .toast .ok{color:#2b8a3e}
.toast .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.toast button.u{white-space:nowrap;height:26px;padding:0 10px;border-radius:7px;background:rgba(255,255,255,.14);color:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px}
:root[data-theme="dark"] .toast button.u{background:rgba(0,0,0,.12)}
.toast kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.6}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;background:#7ddc93;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.help{position:fixed;inset:0;z-index:75;display:none;place-items:center;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.help.on{display:grid}
.helpc{width:min(860px,calc(100vw - 32px));max-height:80vh;overflow:auto;background:var(--surface);border-radius:14px;border:1px solid var(--line-2);box-shadow:var(--shadow-3);padding:18px 22px}
.helpc h2{margin:0 0 12px;font-size:16px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 22px}
.hgrid h5{margin:10px 0 4px;font-size:11px;color:var(--ink-3);letter-spacing:.05em}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;color:var(--ink-2)}
.hrow span:last-child{display:flex;gap:3px}

  .sheet.open{transform:none}
  .sheet.tall{height:90%}
  .sheet .grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
  .shd{padding-top:6px}
  .sinner{padding:14px 24px 40px 28px}
  .review{right:12px;bottom:calc(58% + 12px)}
  .sheet-on .mhud.tr,.sheet-on .mhud.br{right:14px}
  .sheet-on .mhud.bl{bottom:calc(58% + 12px)}
  .hcard.dock{width:min(480px,calc(100vw - 24px))}
  .mhud.tl p{display:none}
  .legend{display:none}
  .docview{grid-template-columns:1fr}.ctxpane{display:none}
  .inboxview{grid-template-columns:1fr}.ib-d{display:none}
  .hgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){

  .hgrid{grid-template-columns:1fr}
}

{id:'s6_1',num:'§6.1',t:'CLI 入口',parent:'s6',room:'cli',blocks:[
 {d:'L0',k:'prose',t:'`crit` コマンドの入口。引数を見てレビュー・コメント・共有・install などのサブコマンドに振り分け、どれにも当たらなければ通常のレビューとして扱う ⟦f:cmd/crit/cli_dispatch.go⟧«v»。'},
 {d:'L1',k:'prose',t:'`crit install <agent>` は、バイナリに埋め込んだ統合ファイルを各ツールの所定のパスへコピーする。埋め込みファイルの sha256 表を持ち、インストール済みのものが古いと起動時に警告する ⟦f:cmd/crit/integration_hashes_gen.go⟧«v»。'},
 {d:'L1',k:'prose',t:'`crit story` の生成経路（`runStoryLLM`）もここにあり、diff 全文を一時ファイルに書いてからエージェントに渡す ⟦st0⟧«v»。詳しくは §6.6。'},
]},
{id:'s6_2',num:'§6.2',t:'daemon 管理',parent:'s6',room:'daemon',blocks:[
 {d:'L0',k:'prose',t:'作業ディレクトリ（と branch）ごとに 1 つの daemon（`crit _serve`）を立て、`~/.crit/sessions/<key>.json` の台帳で再利用する «v»。'},
 {d:'L1',k:'prose',t:'⟪セッションキー⟫は、git mode なら `sha256(cwd + "\\0" + branch)` の先頭 12 桁、ファイル指定なら並べ替えた引数を連結して作る ⟦d1⟧«v»。branch を含めるのは、差分が branch に依存するから（コードのコメント）。'},
 {d:'L1',k:'prose',t:'CLI は daemon の準備ができるまで `/api/session` を 500ms ごとに叩き、最大 5 分待つ ⟦cl1⟧«v»。'},
 {d:'L2',k:'pit',title:'落とし穴',t:'key は symlink を解決した cwd で作る。macOS の `/var` → `/private/var` で別のセッションになるのを防ぐため ⟦d0⟧«v»。'},
 {d:'L3',k:'deep',title:'台帳の生存判定',t:'PID だけでなく `/api/health` も確かめる。PID が再利用されて別のプロセスを生きている daemon と誤認しないため ⟦f:internal/daemon/daemon.go⟧«v»。'},
]},
{id:'s6_3',num:'§6.3',t:'HTTP API · SSE',parent:'s6',room:'server',blocks:[
 {d:'L0',k:'prose',t:'ブラウザと CLI の両方が話す HTTP API（62 ルート）と、変更を押し出す SSE（`/api/events`）を提供する «v»。'},
 {d:'L1',k:'prose',t:'セッションの準備ができるまで、セッションに依存するルートには `withReady` が 503 を返す ⟦s3⟧«v»。'},
 {d:'L1',k:'prose',t:'状態を変えるリクエストは、`Sec-Fetch-Site` が付いていれば `same-origin` だけを通す（CSRF 対策）。付いていなければ CLI や curl とみなして通す ⟦s4⟧«v»。Host ヘッダが loopback 以外なら拒む（DNS rebinding 対策）⟦hst⟧«v»。'},
 {d:'L1',k:'prose',t:'`POST /api/review-cycle` は人の ⟪Finish⟫ まで返らない long-poll で、2 回目以降は先にラウンド完了を知らせる ⟦s1⟧«v»。'},
 {d:'L2',k:'prose',t:'コメントの「Send now」は ⟪global 設定⟫の `agent_cmd` を 10 分の期限で起動し、stdout をそのまま返信として投稿する ⟦s6⟧«v»。'},
 {d:'L2',k:'pit',title:'落とし穴',t:'`server.go` は 3,508 行の 1 ファイルに、ルート定義・SSE・finish・agent 実行が同居している。直近 41 commit のうち 8 がここを変えている ⟦f:internal/server/server.go⟧«v»。'},
]},
{id:'s6_4',num:'§6.4',t:'セッション状態',parent:'s6',room:'session',blocks:[
 {d:'L0',k:'prose',t:'1 回のレビュー（セッション）の状態——ファイル一覧・コメント・⟪ラウンド⟫——を持つ正本。変更を ⟪debounce⟫ して review.json に書き、ファイルの変化を監視し、ラウンドをまたいでコメントの位置を⟪持ち越し⟫する。'},
 {d:'L1',k:'learn',items:['コメントがいつ・どこに保存されるか','ファイルの変化をどう見つけるか','コードが変わったとき、コメントの行がどう付いていくか']},
 {d:'L1',k:'prose',t:'コメントは **ソースの行番号** で持ち、変更のたびに 200ms の ⟪debounce⟫ を挟んで `~/.crit/reviews/<key>/review.json` に書き出す ⟦w1⟧«v»。書き込みは一時ファイルに書いて fsync してから rename する ⟦f:internal/session/atomic_write.go⟧«v»。'},
 {d:'L1',k:'prose',t:'git mode では 1 秒ごとの ticker で `git status --porcelain` を確かめ、files mode ではファイルの mtime を比べる ⟦w2⟧«v»。'},
 {d:'L2',k:'steps',title:'持ち越しの手順',items:[
  '前のラウンドの本文と今の本文の行 diff を取り、旧行 → 新行の対応表を作る ⟦df⟧«v»。',
  'コメントの開始・終了行を対応表で写す。範囲外は `[1, 最終行]` に収める ⟦w5⟧«v»。',
  '写した位置の本文が、コメント作成時の行テキスト（⟪アンカー⟫）と一致するか確かめる。違えばファイル全体から探す ⟦w3⟧«v»。',
  'どこにも見つからなければ `drifted=true` を付け、位置は写した行のまま残す。**コメントは消さない** ⟦w3⟧«v»。']},
 {d:'L1',k:'why',title:'なぜ行番号だけでなく行テキストも持つのか',t:'エージェントが行の中身を少し書き換えただけで ⟪ドリフト⟫ 扱いにしないため。前後の空白を除いて一致、短い方（8 文字以上）が長い方に含まれる、真ん中の 1 か所だけ削られた、編集距離の比が 0.7 以上——のどれかなら「同じ行」とみなす ⟦w4⟧«v»。'},
 {d:'L2',k:'prose',id:'b_q7v3ankr',t:'⟪アンカー⟫ はコメントを作ったときのテキストのまま更新されないため、同じ行が何ラウンドも書き換えられると編集距離の比が 0.7 を下回り、⟪ドリフト⟫ しやすくなると考えられる «i»。'},
 {d:'L2',k:'prose',t:'ファイル単位のコメントと base 側（`side:"old"`）のコメントは写さず、元の位置に固定する。base は ⟪ラウンド⟫ の間で変わらないから ⟦w7⟧«v»。'},
 {d:'L2',k:'pit',title:'落とし穴',t:'`carryForwardComment` はフィールドを 1 つずつ列挙してコピーする。Comment に新しいフィールドを足したらここにも足さないと、ラウンドが進んだときに黙って消える ⟦w6⟧«v»。'},
 {d:'L3',k:'deep',title:'行 diff の計算量',t:'行 diff は Hirschberg 法（分割統治の LCS）で、空間は O(N) だが時間は O(N·M)。10k 行で約 258ms、50 コメントの持ち越し込みで約 393ms かかる（`go test -bench`, M 系 18 コア）⟦df⟧«v»。似た文書どうしなら Myers の O(ND) のほうが速い «i»。'},
 {d:'L3',k:'deep',title:'先読みするファイル数',t:'25 ファイルを超える変更では、本文と diff を先頭 25 ファイルだけ読み、残りは UI で開いたときに読む ⟦ses1⟧«v»。'},
 {d:'L1',k:'recap',items:['保存は 200ms debounce + atomic write','監視は 1 秒ごとの polling','持ち越しは「行 diff → 写像 → 行テキスト照合 → だめなら drifted」で、消さない']},
]},
{id:'s6_5',num:'§6.5',t:'差分',parent:'s6',room:'diff',blocks:[
 {d:'L0',k:'prose',t:'2 つの本文の行単位の差分を計算し、旧行番号 → 新行番号の対応表を作る ⟦df⟧«v»。'},
 {d:'L2',k:'prose',t:'Hirschberg 法なので空間は O(N) だが、時間は O(N·M)。1k 行 2.8ms、5k 行 78ms、10k 行 258ms（ベンチ実測）«v»。'},
]},
{id:'s6_6',num:'§6.6',t:'story 生成',parent:'s6',room:'story',blocks:[
 {d:'L0',k:'prose',t:'diff を「章」に組み直して説明する story mode の、入力（⟪prep⟫）づくりと、エージェントが書いた JSON の検証（ingest）を受け持つ。'},
 {d:'L1',k:'prose',t:'`crit story` は diff 全文を一時ファイルに書き、プロンプトにはそのパスだけを渡す（prompt-by-reference）⟦st0⟧«v»。'},
 {d:'L1',k:'prose',id:'b_r2c8tm4x',t:'agent の出力が JSON として読めないときは、エラー文を添えて **正確に 1 回だけ** 再試行し、2 回目も失敗したら生の出力を一時ファイルに保存して exit 1 で終わる ⟦st1⟧«v»。各回には 5 分の期限がある ⟦st2⟧«v»。'},
 {d:'L2',k:'steps',title:'ingest の検証順',items:['形を確かめる（章 ID は `[A-Za-z0-9_-]+` で一意）','drift: 指紋が今の diff と違えば拒否 ⟦ig2⟧«v»','重複: 同じ hunk が 2 か所以上にあれば拒否','配置率が 50% 未満なら拒否。以上なら欠けた hunk を ⟪support⟫ に自動で補う ⟦ig3⟧ ⟦ig1⟧«v»']},
 {d:'L2',k:'pit',title:'落とし穴',t:'推奨経路（`--story-file`）では `scope_fingerprint` が付かないため、drift 判定（`ScopeFingerprint != ""` のガード）は実際には働かない ⟦ig2⟧«v»。'},
 {d:'L1',k:'why',title:'なぜ出力を ID 参照（file_path, old_start）に限るのか',t:'出力 token を hunk 数に比例する小さな JSON に抑え、検証と修復をサーバー側の決まったコードでできるようにするため ⟦f:integrations/prompts/on_story_generate.md⟧«v»。'},
]},

/* ---------- keyboard (IME-safe: isComposing || keyCode 229; letters by e.code) ---------- */
function isComposing(e){return e.isComposing||e.keyCode===229}
let gPending=0,altT=null;

  const mod=e.metaKey||e.ctrlKey;const inField=e.target.closest&&e.target.closest('input,textarea,[contenteditable]');
  if(mod&&e.code==='KeyK'){e.preventDefault();$('#palette').classList.contains('on')?closePal():openPal();return}
  if($('#palette').classList.contains('on')){
    if(e.key==='Escape'){closePal();e.preventDefault()}else if(e.key==='ArrowDown'){palIdx=Math.min(palRes.length-1,palIdx+1);renderPal();e.preventDefault()}else if(e.key==='ArrowUp'){palIdx=Math.max(0,palIdx-1);renderPal();e.preventDefault()}else if(e.key==='Enter'&&palRes[palIdx]){runPal(palRes[palIdx]);e.preventDefault()}return}
  if($('#help').classList.contains('on')&&(e.key==='Escape'||e.key==='?')){$('#help').classList.remove('on');return}
  if(S.comp){if(mod&&e.key==='Enter'){submitComposer();e.preventDefault();return}if(mod&&/^Digit[1-4]$/.test(e.code)){S.comp.intent=INTENTS[+e.code.slice(5)-1][0];renderFloat();$('#cpTa').focus();e.preventDefault();return}if(e.key==='Escape'){closeComposer();e.preventDefault();toast('閉じました（下書きは保存済み）',2200);return}}

    if(!inField&&e.code==='KeyN'){const n=hunkCount();S.review.focus=e.shiftKey?Math.max(-1,S.review.focus-1):Math.min(n-1,S.review.focus+1);renderReview();scrollToEl($('#review .focus'),$('#review .rv-b'));e.preventDefault();return}if(e.key==='Escape'){closeReview();return}}
  if(inField)return;
  if(e.key==='Alt'){clearTimeout(altT);altT=setTimeout(()=>root.classList.add('show-all'),120);return}
  if(mod&&e.key==='Enter'&&S.job&&S.job.st==='ready'){applyProposal(1);e.preventDefault();return}
  if(mod&&e.key==='Backspace'&&S.job&&S.job.st==='ready'){rejectProposal();e.preventDefault();return}
  if(mod&&e.code==='KeyZ'&&S.job&&S.job.st==='done'){undoAccept();e.preventDefault();return}
  if(mod||e.altKey)return;
  if(gPending&&Date.now()-gPending<1200){gPending=0;const m={KeyH:'map',KeyD:'doc',KeyI:'inbox',KeyR:'review'}[e.code];if(m){setView(m);e.preventDefault()}return}
  if(e.key==='Escape'){if($('#hcard').classList.contains('on')){hideCard(true);return}if(S.sel){hideSelTb();getSelection().removeAllRanges();S.sel=null;return}if(S.view==='map'&&sheetOpen()&&!S.overview){closeSheet();return}if(S.view==='map'&&lastLv>0){zoomLevel(lastLv-1);return}return}
  if(e.key==='?'){renderHelp();$('#help').classList.add('on');return}
  if(e.key==='-'){stepDepth(-1);e.preventDefault();return}if(e.key==='='||e.key==='+'){stepDepth(1);e.preventDefault();return}if(e.key==='0'&&!e.shiftKey){if(S.depthTarget==='map'&&S.view==='map')zoomLevel(2);else setLevel('standard');return}
  switch(e.code){
   case 'KeyG':gPending=Date.now();return;
   case 'KeyC':if(e.shiftKey){S.overlays.pins=!S.overlays.pins;renderOvChips();renderPins();applyCam();return}doAct('comment');e.preventDefault();return;
   case 'KeyE':doAct('explain');e.preventDefault();return;
   case 'KeyF':if(e.shiftKey){doAct('batch');return}doAct('fix');e.preventDefault();return;
   case 'KeyP':doAct('copyprompt');return;
   case 'KeyY':if(S.sheetSec)doAct('copylink');return;
   case 'KeyR':if(S.job&&S.job.st==='ready')openReview();return;
   case 'KeyB':if(root.getAttribute('data-rail')==='off'){root.removeAttribute('data-rail');S.railUser=false}else{root.setAttribute('data-rail','off');S.railUser=true}save();setTimeout(applyCam,20);return;
   case 'KeyH':if(S.view==='inbox'){S.hideResolved=!S.hideResolved;renderInbox();}else{S.hideResolved=!S.hideResolved;renderPins();applyCam()}return;
   case 'KeyO':{const c=hcAnchor;if(c&&c.dataset.cite){$('#hcard').classList.add('pinned');S.pinnedCite=c.dataset.cite;if(S.view==='doc')renderCtxPane()}return}
   case 'KeyJ':case 'KeyK':moveFocus(e.code==='KeyJ'?1:-1);e.preventDefault();return;
  }
  if(/^Digit[1-9]$/.test(e.code)&&S.view!=='inbox'){const n=+e.code.slice(5);const s=SECS.find(x=>x.num==='§'+n);if(s)openSec(s.id)}
});
document.addEventListener('keyup',e=>{if(e.key==='Alt'){clearTimeout(altT);root.classList.remove('show-all')}});
addEventListener('blur',()=>root.classList.remove('show-all'));
function moveFocus(d){
  if(S.view==='inbox'){const l=$$('#ibList .ibi');const i=l.findIndex(x=>x.dataset.th===S.inboxSel);const n=l[Math.max(0,Math.min(l.length-1,i+d))];if(n){S.inboxSel=n.dataset.th;renderInbox();scrollToEl($('#ibList .cur'),$('#ibList'))}return}
  if(S.view==='map'&&(!sheetOpen()||S.overview)){const ids=ROOMS.map(r=>r.id);const i=ids.indexOf(S.room);selectRoom(ids[(i+d+ids.length)%ids.length]);return}
  const host=S.view==='doc'?$('#docinner'):$('#sinner');const bl=$$('.blk',host).filter(b=>b.offsetParent);const i=bl.findIndex(b=>b.dataset.b===S.focusBlk);const n=bl[Math.max(0,Math.min(bl.length-1,i+d))];if(!n)return;
  $$('.blk.focus').forEach(b=>b.classList.remove('focus'));n.classList.add('focus');S.focusBlk=n.dataset.b;scrollToEl(n,S.view==='doc'?$('#docscroll'):$('#sbody'));
}

/* ---------- director: deterministic states for review & screenshots ---------- */
function hashArg(k){const r=new RegExp('[#&]'+k+'=([^&]+)').exec(location.hash);return r?decodeURIComponent(r[1]):null}
function generatedNow(){S.phase='generated';S.genDone=new Set(SECS.map(s=>s.id));['s0','s1','s2'].forEach(x=>S.visited.add(x));roomBadges()}
function director(st){
  jobTimers.forEach(clearTimeout);clearInterval(genTimer);closePal();closeReview();S.comp=null;S.job=null;hideCard(true);hideSelTb();
  const room=hashArg('room');
  S.threads=st==='first-run'||st==='scan'||st==='generating'?[]:JSON.parse(JSON.stringify(THREADS));
  if(st==='first-run'||st==='scan'){S.phase='scanned';S.genDone=new Set();S.overview=true;S.room=null;S.sheetSec=null;setView('map',true);openSheet(420);renderAll();setTimeout(()=>{animateTo(homeCam(),0);const z=hashArg('z');if(z)setTimeout(()=>zoomLevel(+z),60)},20);return}
  if(st==='generating'){S.phase='scanned';S.overview=true;setView('map',true);openSheet(420);renderAll();setTimeout(()=>{animateTo(homeCam(),0);startGen()},20);return}
  generatedNow();renderOvChips();renderPins();
  if(st==='reader'||st==='doc-map'){setView('map',true);openSec(hashArg('sec')||(room?RM[room].sec:'s6_4'));const z=hashArg('z');if(z)setTimeout(()=>zoomLevel(+z),420);const pk=hashArg('peek');if(pk)setTimeout(()=>{const c=$(`#sinner .cite[data-cite="${pk}"]`);if(c){scrollToEl(c,$('#sbody'),'center');setTimeout(()=>showCard(c,peekHTML(pk)),60)}},450);const gl=hashArg('gloss');if(gl)setTimeout(()=>{const g=$(`#sinner .g[data-g="${gl}"]`);if(g)showCard(g,glossHTML(gl))},450);return}
  if(st==='doc'){openSec('s6_4',true);setView('doc');return}
  if(st==='composer'||st==='running'||st==='ready'||st==='accepted'){
    setView('map',true);openSec('s6_6');
    setTimeout(()=>{const b=$('#b_r2c8tm4x');if(b)$('#sbody').scrollTop=b.offsetTop-150;selectText('b_r2c8tm4x','エラー文を添えて','再試行し');
      if(st==='composer'){openComposer('change',anchorNow());S.comp.body=FIX.ask;renderFloat(true);updEst();return}
      openComposer('change',anchorNow());S.comp.body=FIX.ask;submitComposer();
      if(st==='running'){return}
      jobTimers.forEach(clearTimeout);const j=S.job;j.ev=STAGES_FIX.map(s=>({ph:s[0],n:s[1],d:s[2],dur:s[3]}));j.st='ready';j.el=7.8;
      renderAll();
      if(st==='ready'){if(hashArg('review')!=='0')openReview();return}
      applyProposal(1);
    },380);return}
  if(st==='inbox'){S.job={th:FIX.th,kind:'change',blk:'b_r2c8tm4x',sec:'s6_6',room:'story',st:'ready',t0:0,ev:[],demo:true,body:FIX.ask,est:{mode:'patch',inK:2.6,outK:1.2},title:FIX.title,el:7.8};S.inboxSel=hashArg('th')||FIX.th;setView('inbox');return}
  if(st==='palette'){setView('map',true);openSec('s6_4');setTimeout(()=>openPal(hashArg('q')||'mochikoshi'),400);return}
}

/* ---------- init ---------- */
function init(){
  if(hashArg('clean'))root.classList.add('clean');
  setLevel(S.level);themeIcon();$('#langBtn .mono').textContent=S.lang.toUpperCase();applyI18n();
  buildMap();renderZoomc();renderLegend();bindMap();renderOvChips();
  new ResizeObserver(()=>{homeCam();applyCam()}).observe($('#stage'));
  const st=hashArg('s')||'first-run';
  director(st);
  addEventListener('hashchange',()=>director(hashArg('s')||'first-run'));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.title.startsWith('('))setTimeout(()=>document.title='crit — 見取り図 mitori',1500)});
}
init();

</script>
