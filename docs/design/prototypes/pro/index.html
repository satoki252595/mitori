<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="mitori PRO COCKPIT prototype — crit の設計書（静的スキャン → 生成 → 指摘 → 修正 → 採用）">
<title>mitori — crit</title>
<script>/* head inline: restore theme / pane width before first paint (CLS 0, m3e Skeleton 方式) */
(function(){var d=document.documentElement,h=new URLSearchParams(location.hash.slice(1)),s={};try{s=JSON.parse(localStorage.getItem('mitori_ui')||'{}')}catch(e){}
var th=h.get('theme')||s.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=th;
if(s.sideW)d.style.setProperty('--side-w',s.sideW+'px');var l=h.get('lang')||s.lang;if(l)d.lang=l;})();
</script>
<style>
/* =========================================================================
   mitori — PRO COCKPIT prototype. OS font stacks only (addendum A9). No web fonts.
   Tokens: every color is a variable; dark is first-class (not an inversion).
   ========================================================================= */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", "Yu Gothic UI", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", "BIZ UDGothic", "Noto Sans Mono CJK JP", monospace;
  --top-h: 44px; --status-h: 26px; --rail-w: 248px; --side-w: 500px; --side-map: 420px;
  --r-s: 5px; --r-m: 8px; --r-l: 12px;
  --ease: cubic-bezier(.2,.7,.2,1);
}
html[data-theme="light"]{
  color-scheme: light;
  --bg:#fbfbfc; --bg-2:#f5f6f8; --panel:#ffffff; --raise:#ffffff; --raise-2:#f2f3f6; --hover:#f1f2f5; --hover-weak:rgba(20,24,40,.025);
  --border:#e4e6ea; --border-2:#d6d9df; --fg:#15171c; --fg-2:#353a43; --muted:#646b77; --faint:#959ba6;
  --accent:#4f5bd5; --accent-bg:rgba(79,91,213,.09); --accent-bg-weak:rgba(79,91,213,.045); --accent-fg:#3c46b8; --on-accent:#fff;
  --ai:#8a4fd8; --ai-bg:rgba(138,79,216,.10);
  --ok:#17845a; --ok-bg:rgba(23,132,90,.10); --ok-strong:rgba(23,132,90,.22);
  --warn:#a86a00; --warn-bg:rgba(200,130,0,.11);
  --err:#c93c3c; --err-bg:rgba(201,60,60,.09);
  --info:#1e6fd6; --info-bg:rgba(30,111,214,.09);
  --add:rgba(23,132,90,.09); --add-strong:rgba(23,132,90,.20); --del:rgba(201,60,60,.08); --del-strong:rgba(201,60,60,.18);
  --hl:rgba(79,91,213,.085); --hl-edge:#4f5bd5;
  --code-bg:#fcfcfd; --code-gut:#f6f7f9;
  --tk-kw:#7b3fd0; --tk-str:#1d7a3e; --tk-com:#8a909b; --tk-num:#b2561a; --tk-fn:#1f5fc0; --tk-ty:#0b7b85; --tk-h:#15171c;
  --scrim: rgba(22,26,34,.20);
  --shadow: 0 12px 32px rgba(18,22,32,.14), 0 2px 6px rgba(18,22,32,.06), 0 0 0 1px rgba(18,22,32,.06);
  --shadow-s: 0 1px 2px rgba(18,22,32,.06), 0 0 0 1px rgba(18,22,32,.04);
  --grid: rgba(79,91,213,.07);
  --toast-bg:#15171c; --toast-fg:#f3f4f6;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1013; --bg-2:#111317; --panel:#15181d; --raise:#191c22; --raise-2:#1f232a; --hover:#1b1f25; --hover-weak:rgba(255,255,255,.018);
  --border:#22262d; --border-2:#2d323a; --fg:#e8eaee; --fg-2:#c4c9d1; --muted:#8c939d; --faint:#5f6670;
  --accent:#8d95ff; --accent-bg:rgba(141,149,255,.13); --accent-bg-weak:rgba(141,149,255,.06); --accent-fg:#b5baff; --on-accent:#0e1013;
  --ai:#c49dff; --ai-bg:rgba(196,157,255,.13);
  --ok:#4fc58d; --ok-bg:rgba(79,197,141,.13); --ok-strong:rgba(79,197,141,.24);
  --warn:#e6b65a; --warn-bg:rgba(230,182,90,.13);
  --err:#f17070; --err-bg:rgba(241,112,112,.12);
  --info:#62acff; --info-bg:rgba(98,172,255,.13);
  --add:rgba(79,197,141,.11); --add-strong:rgba(79,197,141,.26); --del:rgba(241,112,112,.10); --del-strong:rgba(241,112,112,.24);
  --hl:rgba(141,149,255,.11); --hl-edge:#8d95ff;
  --code-bg:#0f1115; --code-gut:#111318;
  --tk-kw:#c6a2ff; --tk-str:#97d6a3; --tk-com:#6b7380; --tk-num:#f0b585; --tk-fn:#83b8ff; --tk-ty:#6fd2d8; --tk-h:#e8eaee;
  --scrim: rgba(4,6,9,.55);
  --shadow: 0 16px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --shadow-s: 0 0 0 1px rgba(255,255,255,.04);
  --grid: rgba(141,149,255,.05);
  --toast-bg:#eceef2; --toast-fg:#111317;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font:13px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
kbd,.kbd{font:500 10.5px/1 var(--font-mono);display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:4px;border:1px solid var(--border-2);border-bottom-width:2px;color:var(--muted);background:var(--raise);vertical-align:1px}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:rgba(141,149,255,.32)}
::highlight(mitori-quote){background:rgba(141,149,255,.30);color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) var(--status-h);height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;background:var(--bg-2);border-bottom:1px solid var(--border);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.01em;flex:none}
.brand svg{width:20px;height:20px}
.ws{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:6px;color:var(--fg-2);flex:none}
.ws:hover{background:var(--hover)}
.ws .br{font:11.5px var(--font-mono);color:var(--muted)}
.vsep{width:1px;height:18px;background:var(--border-2);flex:none}
.crumbs{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.crumbs b{color:var(--fg-2);font-weight:500}
.crumbs i{font-style:normal;color:var(--faint);margin:0 5px}
.seg{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--raise-2);border:1px solid var(--border);flex:none}
.seg button{height:24px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--fg-2)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow-s)}
html[data-theme="dark"] .seg button[aria-pressed="true"],html[data-theme="dark"] .seg button[aria-selected="true"]{background:#2a2f37}
.seg .cnt{font:600 10.5px/16px var(--font-mono);padding:0 5px;border-radius:8px;background:var(--accent-bg);color:var(--accent-fg)}
.seg .cnt.ai{background:var(--ai-bg);color:var(--ai)}
.kbtn{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 10px;width:210px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--faint);font-size:12.5px;flex:none}
.kbtn:hover{border-color:var(--border-2);color:var(--muted)}
.kbtn span{flex:1;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);font:12px var(--font-mono);color:var(--fg-2);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--border-2)}
.chip .lbl{font-family:var(--font-sans);color:var(--muted);font-size:11.5px}
.chip.jobs{gap:8px}
.chip .g{display:inline-flex;align-items:center;gap:4px}
.ibtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.lang{font:600 11px var(--font-mono);letter-spacing:.04em}
.spin{width:10px;height:10px;border-radius:50%;border:1.6px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.ai{background:var(--ai)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)} .dot.info{background:var(--info)} .dot.off{background:var(--faint)}

.main{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) 5px var(--side-w);min-height:0}
#app.v-map .main{grid-template-columns:var(--rail-w) minmax(0,1fr) 5px var(--side-map)}
#app.no-rail .main{grid-template-columns:0 minmax(0,1fr) 5px var(--side-w)}
#app.no-side .main{grid-template-columns:var(--rail-w) minmax(0,1fr) 0 0}
#app.no-rail.no-side .main{grid-template-columns:0 minmax(0,1fr) 0 0}
#app.no-rail .rail,#app.no-side .side,#app.no-side .splitter{visibility:hidden}

/* ---------- rail ---------- */
.rail{background:var(--bg-2);border-right:1px solid var(--border);overflow:auto;overscroll-behavior:contain;padding:10px 8px 16px;min-width:0}
.pathcard{border:1px solid var(--border);background:var(--panel);border-radius:var(--r-m);padding:10px 10px 9px;margin:0 2px 12px;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;align-items:center}
.pathcard .ring{grid-row:span 2;width:34px;height:34px}
.pathcard .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.pathcard .t button{font-weight:600;display:flex;align-items:center;gap:3px}
.pathcard .s{font-size:11.5px;color:var(--muted)}
.pathcard .dots{grid-column:1/-1;display:flex;gap:3px;margin-top:6px}
.pathcard .dots i{flex:1;height:3px;border-radius:2px;background:var(--border-2)}
.pathcard .dots i.done{background:var(--ok)} .pathcard .dots i.cur{background:var(--accent)}
.rh{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.06em;padding:8px 10px 4px;display:flex;justify-content:space-between}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;height:28px;padding:0 8px 0 6px;border-radius:6px;font-size:13px;color:var(--fg-2);text-decoration:none;position:relative;gap:2px}
.toc a:hover{background:var(--hover)}
.toc a .n{font:11px var(--font-mono);color:var(--faint);text-align:right;padding-right:8px}
.toc a .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a .m{display:flex;align-items:center;gap:6px;font:11px var(--font-mono);color:var(--faint)}
.toc a.cur{background:var(--accent-bg);color:var(--fg)}
.toc a.cur::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.toc a.inpath .n::after{content:"";position:absolute;left:3px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.toc a.read .n::after{background:var(--ok)}
.toc .sub a{height:26px;font-size:12.5px;padding-left:22px;grid-template-columns:30px minmax(0,1fr) auto}
.toc .st{width:12px;height:12px;display:inline-grid;place-items:center}
.st-ok{color:var(--ok)} .st-gen{color:var(--ai)} .st-static{color:var(--faint)} .st-stale{color:var(--warn)} .st-lazy{color:var(--faint)}
.tbub{font:600 10px/15px var(--font-mono);padding:0 5px;border-radius:8px;background:var(--raise-2);color:var(--muted)}
.tbub.ai{background:var(--ai-bg);color:var(--ai)}
.railfoot{margin:14px 4px 0;padding:10px 8px 0;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);display:grid;gap:5px}
.railfoot .row{display:flex;justify-content:space-between;gap:8px}
.railfoot .row b{font:500 11.5px var(--font-mono);color:var(--fg-2)}
.bar{height:4px;border-radius:3px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:3px}

/* ---------- center ---------- */
.center{overflow:auto;overscroll-behavior:contain;background:var(--bg);position:relative;scroll-padding-top:20px;min-width:0}
.view{display:none} .view.on{display:block}
.doc{max-width:810px;margin:0 auto;padding:22px 30px 160px 84px;position:relative}
.chap-k{font:11.5px var(--font-mono);color:var(--faint);display:flex;gap:10px;align-items:center;margin-bottom:4px;min-height:24px}
.chap-h{font-size:24px;line-height:1.35;font-weight:650;margin:0 0 8px;letter-spacing:.005em;word-break:auto-phrase;text-wrap:balance}
.chap-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 18px;font:12px var(--font-mono);color:var(--muted)}
.chap-meta .dotsep{color:var(--faint)}
.chap-k .sp{flex:1}
.chap-k .acts{display:flex;gap:4px}
.chap-k .acts button{height:24px;padding:0 8px;border-radius:6px;font:12px var(--font-sans);color:var(--muted);display:flex;align-items:center;gap:5px}
.chap-k .acts button:hover{background:var(--hover);color:var(--fg)}
.mchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--raise-2);border:1px solid var(--border);font:11.5px var(--font-mono);color:var(--muted);white-space:nowrap}
.mchip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.mchip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.mchip.ai{color:var(--ai);background:var(--ai-bg);border-color:transparent}
.mchip.btn{cursor:pointer;color:var(--fg-2)} .mchip.btn:hover{border-color:var(--border-2)}
.mchip .k{font-family:var(--font-sans);color:var(--faint)}
.learn{border:1px solid var(--border);background:var(--panel);border-radius:var(--r-m);padding:11px 14px 10px 14px;margin:4px 0 22px}
.learn h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.learn ul{margin:0;padding-left:18px;font-size:14px;line-height:1.75}
.prose{font-size:15px;line-height:1.85;color:var(--fg-2)}
html:lang(en) .prose{line-height:1.7}
.prose h2{font-size:18.5px;line-height:1.4;font-weight:650;color:var(--fg);margin:34px 0 12px;display:flex;align-items:baseline;gap:10px;word-break:auto-phrase;text-wrap:balance}
.prose h2 .hn{font:500 13px var(--font-mono);color:var(--faint)}
.prose h3{font-size:15.5px;font-weight:650;color:var(--fg);margin:22px 0 8px}
.prose p{margin:0;line-break:strict;overflow-wrap:anywhere;text-wrap:pretty;text-autospace:normal;text-spacing-trim:trim-start}
.prose strong,.prose b{font-weight:600;color:var(--fg)}
.prose code{font:12.8px var(--font-mono);padding:1px 5px;border-radius:4px;background:var(--raise-2);border:1px solid var(--border);color:var(--fg);white-space:nowrap}
.prose ol,.prose ul{margin:0;padding-left:22px}
.prose li{margin:3px 0;line-break:strict}
.prose table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.55;margin:2px 0}
.prose th,.prose td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.prose th{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;background:var(--bg-2)}
.prose td code{white-space:nowrap}
.tabnum td{font-variant-numeric:tabular-nums}

/* blocks */
.blk{position:relative;margin:0 -10px 14px;padding:3px 10px;border-radius:7px;transition:background-color .12s}
.blk:hover{background:var(--hover-weak)}
.blk.focus{background:var(--accent-bg-weak);box-shadow:inset 2px 0 0 var(--accent)}
.blk.spied::after{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent);opacity:.55}
.gut{position:absolute;left:-74px;top:5px;width:62px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;user-select:none}
.gut .bid{display:none;font:9.5px var(--font-mono);color:var(--faint);white-space:nowrap}
.blk:hover>.gut .bid,.blk:hover>.gut .lno,.blk.focus>.gut .bid,.blk.focus>.gut .lno{visibility:hidden}
.gut .lno{display:none;font:10px var(--font-mono);color:var(--faint)}
.conf{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;cursor:help}
.conf svg{width:13px;height:13px}
.conf.v{color:var(--ok)} .conf.i{color:var(--warn)} .conf.h{color:var(--info)} .conf.s{color:var(--warn)}
.tmark{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 5px;border-radius:9px;font:600 10px var(--font-mono);background:var(--raise-2);color:var(--muted);cursor:pointer;border:1px solid var(--border)}
.tmark.ai{background:var(--ai-bg);color:var(--ai);border-color:transparent}
.btools{position:absolute;left:-44px;top:28px;display:flex;flex-direction:column;gap:1px;padding:2px;border-radius:7px;background:var(--raise);border:1px solid var(--border-2);box-shadow:var(--shadow-s);opacity:0;pointer-events:none;transform:translateX(-2px);transition:opacity .1s,transform .1s;z-index:3}
.blk:hover>.btools,.blk.focus>.btools{opacity:1;pointer-events:auto;transform:none}
.btools button{width:24px;height:22px;padding:0;border-radius:5px;color:var(--muted);display:grid;place-items:center}
.btools button[data-act="p"],.btools button[data-act="y"]{display:none}
.btools kbd{display:none}
.btools button:hover{background:var(--hover);color:var(--fg)}
.btools kbd{height:15px;min-width:15px;font-size:10px;border-bottom-width:1px}
.cite{display:inline-flex;align-items:center;gap:0;height:20px;padding:0 6px;margin:0 2px;border-radius:5px;font:500 11.5px/1 var(--font-mono);color:var(--accent-fg);background:var(--accent-bg);border:1px solid transparent;text-decoration:none;vertical-align:1.5px;white-space:nowrap;cursor:pointer;transition:border-color .1s}
.cite:hover,.cite:focus-visible,.cite.on{border-color:var(--accent);outline:none}
.cite .ln{color:var(--muted)}
.citesum{display:none;align-items:center;gap:4px;height:20px;padding:0 7px;margin-left:4px;border-radius:10px;font:600 11px/1 var(--font-sans);color:var(--accent-fg);background:var(--accent-bg);vertical-align:1.5px;cursor:pointer}
.term{text-decoration:none;cursor:help;border-radius:2px}
.term.u{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px;text-decoration-thickness:1px}
.term:hover{background:var(--accent-bg-weak);text-decoration-color:var(--accent)}
.inf{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;margin:0 2px;border-radius:5px;font:600 11px/1 var(--font-sans);color:var(--warn);border:1px dashed var(--warn);vertical-align:1.5px;white-space:nowrap}
.inf button{font:600 10.5px var(--font-sans);color:var(--muted);padding-left:4px;border-left:1px solid var(--border-2);margin-left:2px}
.inf button:hover{color:var(--fg)}
.hv{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;margin:0 2px;border-radius:5px;font:600 11px/1 var(--font-sans);color:var(--info);background:var(--info-bg);vertical-align:1.5px;white-space:nowrap}
.callout{border:1px solid var(--border);border-radius:var(--r-m);padding:10px 14px 11px;background:var(--panel);position:relative}
.callout .ch{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;font-weight:650;letter-spacing:.02em;margin:0 0 4px;color:var(--muted)}
.callout .ch .src{margin-left:auto;font-weight:500;letter-spacing:0}
.callout.why{border-left:3px solid var(--info)} .callout.why .ch{color:var(--info)}
.callout.pit{border-left:3px solid var(--warn)} .callout.pit .ch{color:var(--warn)}
.callout.recap{border-left:3px solid var(--ok)} .callout.recap .ch{color:var(--ok)}
.callout.q{border-left:3px solid var(--ai)} .callout.q .ch{color:var(--ai)}
.callout p,.callout li{font-size:14px;line-height:1.8}
.callout.why.fold .ch{cursor:pointer;margin:0}
.callout.why.fold .ch::after{content:"開く ▸";margin-left:auto;font:600 11px var(--font-sans);color:var(--muted);letter-spacing:0;order:3;white-space:nowrap}
.callout.why.fold:not(.open) .ch .src{display:none}
.callout.why.fold.open .ch{margin:0 0 4px}
.callout.why.fold.open .ch::after{content:"閉じる ▾"}
.callout.why.fold:not(.open)>p{display:none}
.callout.why .ch .src{order:2}
details.deep{border:1px solid var(--border);border-radius:var(--r-m);background:var(--panel)}
details.deep>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--fg-2)}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary .chev{transition:transform .15s;color:var(--faint)}
details.deep[open]>summary .chev{transform:rotate(90deg)}
details.deep>summary .l3{font:600 10px var(--font-mono);padding:2px 6px;border-radius:4px;background:var(--raise-2);color:var(--muted);border:1px solid var(--border)}
details.deep>summary .rt{margin-left:auto;font:11px var(--font-mono);color:var(--faint);font-weight:500}
details.deep>.dbody{padding:0 14px 12px;font-size:14px;line-height:1.8}
.morel3{display:none;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px dashed var(--border-2);font-size:12px;color:var(--muted);margin:0 0 14px}
.morel3:hover{color:var(--fg);border-color:var(--accent)}
.figure{border:1px solid var(--border);border-radius:var(--r-m);background:var(--panel);padding:10px 10px 6px;overflow:hidden}
.figure figcaption{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:2px 4px 6px}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps>li{counter-increment:s;position:relative;padding-left:34px!important;margin:8px 0!important}
.steps>li::before{content:counter(s);position:absolute;left:0;top:3px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 11.5px var(--font-mono);color:var(--muted);background:var(--raise-2);border:1px solid var(--border)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:36px 0 0}
.pager a{display:block;border:1px solid var(--border);border-radius:var(--r-m);padding:10px 14px;text-decoration:none;background:var(--panel)}
.pager a:hover{border-color:var(--accent)}
.pager .pk{font-size:11.5px;color:var(--muted)} .pager .pt{font-size:14px;font-weight:600;margin-top:2px}
.pager a.nx{text-align:right}
.lazy{border:1px dashed var(--border-2);border-radius:var(--r-m);padding:12px 14px;display:grid;gap:8px;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--hover-weak) 10px 20px)}
.lazy .lh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.lazy .lh button{margin-left:auto}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.skel{display:grid;gap:9px;padding:6px 0 4px}
.skel i{display:block;height:11px;border-radius:4px;background:linear-gradient(90deg,var(--raise-2),var(--hover),var(--raise-2));background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.genline{font:11.5px var(--font-mono);color:var(--ai);display:flex;align-items:center;gap:8px}

/* reader levels — READER_LEVEL_RULES (contracts/core.ts) */
.lvl-newcomer .cite{display:none}
.lvl-newcomer .citesum{display:inline-flex}
.lvl-newcomer .term{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px;text-decoration-thickness:1px}
.lvl-newcomer .blk[data-depth="L3"]{display:none}
.lvl-newcomer .morel3{display:inline-flex}
.lvl-expert .term.u{text-decoration:none}
.lvl-expert .cite .ln{display:inline}
.lvl-expert .gut .bid,.lvl-expert .gut .lno{display:block}
.alt-held .cite{display:inline-flex!important}
.alt-held .citesum{display:none!important}
.alt-held .conf{box-shadow:0 0 0 1px currentColor}

/* inline threads / composer / job card */
.thread{margin:8px -10px 18px;border:1px solid var(--border-2);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-s);overflow:hidden;animation:thIn .14s var(--ease)}
@keyframes thIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.th-h{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);min-height:36px}
.th-h .who{font-weight:600;color:var(--fg-2)}
.th-h .sp{flex:1}
.th-h .tid{font:11px var(--font-mono);color:var(--faint)}
.state{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:650;white-space:nowrap}
.state.queued,.state.draft{color:var(--muted);background:var(--raise-2)}
.state.running,.state.preparing,.state.gating{color:var(--info);background:var(--info-bg)}
.state.ready{color:var(--ai);background:var(--ai-bg)}
.state.accepted,.state.resolved,.state.answered{color:var(--ok);background:var(--ok-bg)}
.state.failed{color:var(--err);background:var(--err-bg)}
.state.outdated,.state.waiting_lock,.state.mention{color:var(--warn);background:var(--warn-bg)}
.state.reverted{color:var(--muted);background:var(--raise-2)}
.th-b{padding:10px 12px}
.quote{border-left:2px solid var(--accent);padding:3px 10px;margin:0 0 10px;font-size:13px;line-height:1.7;color:var(--fg-2);background:var(--accent-bg-weak);border-radius:0 5px 5px 0}
.quote .qa{display:block;font:11px var(--font-mono);color:var(--faint);margin-top:2px}
.intents{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;align-items:center}
.ichip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:13px;border:1px solid var(--border-2);font-size:12.5px;color:var(--fg-2);background:var(--panel)}
.ichip:hover{border-color:var(--muted)}
.ichip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ichip[aria-pressed="true"] kbd{background:transparent;color:inherit;border-color:rgba(127,127,127,.5)}
.ichip kbd{height:16px;font-size:9.5px;border-bottom-width:1px}
.target{display:flex;gap:4px;margin:0 0 8px;font-size:12px;align-items:center;color:var(--muted)}
.target .seg button{font-size:11.5px;height:22px}
.composer textarea{width:100%;min-height:68px;resize:vertical;font:14px/1.7 var(--font-sans);color:var(--fg);background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:8px 11px;outline:none;display:block}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.composer textarea::placeholder{color:var(--faint)}
.ctxrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:9px 0 0}
.ctxrow .lbl{font-size:11.5px;color:var(--faint);margin-right:2px}
.cchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 3px 0 8px;border-radius:6px;background:var(--raise-2);border:1px solid var(--border);font:11.5px var(--font-mono);color:var(--fg-2);white-space:nowrap}
.cchip .tk{color:var(--muted)}
.cchip.sug{border-style:dashed;background:transparent;color:var(--muted)}
.cchip.fixed{background:transparent;color:var(--faint)}
.cchip .x{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--faint)}
.cchip .x:hover{background:var(--hover);color:var(--err)}
.cchip.add{padding:0 8px;cursor:pointer;color:var(--muted);background:transparent;border-style:dashed}
.cchip.add:hover{color:var(--fg);border-color:var(--accent)}
.cfoot{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-top:1px solid var(--border);background:var(--bg-2);flex-wrap:wrap}
.est{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--panel);font:12px var(--font-mono);color:var(--fg-2);position:relative;font-variant-numeric:tabular-nums;cursor:help}
.est b{font-weight:650;color:var(--fg)}
.est .s{width:1px;height:12px;background:var(--border-2)}
.est.upd{animation:estUpd .35s var(--ease)}
@keyframes estUpd{0%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}100%{}}
.route{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.route code{font:11px var(--font-mono);padding:0 4px;border-radius:3px;background:var(--raise-2);border:1px solid var(--border)}
.cfoot .sp{flex:1}
.cbtns{display:flex;gap:6px;margin-left:auto;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--border-2);background:var(--panel);font-size:12.5px;font-weight:550;color:var(--fg-2);white-space:nowrap}
.btn:hover{border-color:var(--muted);color:var(--fg)}
.btn kbd{height:16px;font-size:10px;border-bottom-width:1px;background:transparent}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri kbd{color:inherit;border-color:rgba(255,255,255,.45)}
html[data-theme="dark"] .btn.pri kbd{border-color:rgba(0,0,0,.35)}
.btn.pri:hover{filter:brightness(1.06);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
html[data-theme="dark"] .btn.ok{color:#0b1410}
.btn.ok kbd{color:inherit;border-color:rgba(255,255,255,.45)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.big{height:34px;padding:0 16px;font-size:13.5px}
.stages{list-style:none;margin:0;padding:6px 0 4px;font:12px/1.4 var(--font-mono)}
.stages li{display:grid;grid-template-columns:18px 86px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:3px 0;color:var(--fg-2)}
.stages li .sd{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stages li .tm{text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
.stages li.pend{color:var(--faint)} .stages li.pend .sd{color:var(--faint)}
.stages li.cur .sk{color:var(--info)}
.stages .gi{display:grid;place-items:center}
.stages .gi svg{width:12px;height:12px}
.tail{display:flex;align-items:center;gap:8px;margin:6px 0 2px;padding:6px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font:11.5px var(--font-mono);color:var(--muted);overflow:hidden;white-space:nowrap}
.tail .el{margin-left:auto;color:var(--faint)}
.costline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font:11.5px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.costline b{color:var(--fg);font-weight:600}
.costline .delta{color:var(--ok)}
.gates{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gate{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font:11.5px var(--font-mono);background:var(--ok-bg);color:var(--ok)}
.gate.pend{background:var(--raise-2);color:var(--faint)}
.gate.run{background:var(--info-bg);color:var(--info)}
.gate .t{color:var(--muted);opacity:.85}
.summ{margin:4px 0 8px;padding-left:18px;font-size:13.5px;line-height:1.75}
.msg{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 10px}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 10.5px var(--font-sans);color:#fff;background:#6b7280}
.av.me{background:#d0743c} .av.ai{background:linear-gradient(135deg,#8a4fd8,#4f5bd5)}
.msg .mh{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.msg .mh b{color:var(--fg-2);font-weight:600}
.msg .mb{font-size:13.5px;line-height:1.75;color:var(--fg-2)}
.th-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.blk.working{animation:pulse 1.8s ease-in-out infinite;border-radius:7px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px var(--ai),0 0 0 0 transparent}50%{box-shadow:0 0 0 1px var(--ai),0 0 0 5px var(--ai-bg)}}
.blk.flash{animation:flash 1.15s var(--ease) 1}
@keyframes flash{0%{background:var(--ok-strong);box-shadow:inset 3px 0 0 var(--ok)}70%{background:var(--ok-bg);box-shadow:inset 3px 0 0 var(--ok)}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}
ins.sg{text-decoration:none;background:var(--add-strong);color:var(--fg);border-radius:3px;padding:0 1px;box-shadow:inset 0 -1.5px 0 var(--ok)}
del.sg{text-decoration:line-through;text-decoration-color:var(--err);background:var(--del);color:var(--muted);border-radius:3px;padding:0 1px}
.sugbar{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:11.5px;color:var(--ai);font-weight:600}
.sugbar .who{font-weight:500;color:var(--muted)}

/* selection toolbar */
#seltb{position:fixed;z-index:30;display:none;gap:1px;padding:3px;border-radius:9px;background:var(--raise);border:1px solid var(--border-2);box-shadow:var(--shadow)}
#seltb.on{display:flex;animation:thIn .1s var(--ease)}
#seltb button{height:28px;padding:0 9px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--fg-2)}
#seltb button:hover{background:var(--hover);color:var(--fg)}
#seltb kbd{height:15px;min-width:15px;font-size:10px;border-bottom-width:1px}
#seltb .s{width:1px;margin:5px 2px;background:var(--border-2)}
#seltb .tk{font:11px var(--font-mono);color:var(--faint);padding:0 6px 0 2px;display:flex;align-items:center}

/* ---------- splitter & side ---------- */
.splitter{cursor:col-resize;background:transparent;position:relative;z-index:2}
.splitter::after{content:"";position:absolute;inset:0 2px;background:var(--border)}
.splitter:hover::after,.splitter.drag::after{background:var(--accent);inset:0 1.5px}
.side{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--code-bg);border-left:0}
.stabs{height:38px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-bottom:1px solid var(--border);background:var(--bg-2);flex:none}
.stabs .seg button{height:24px}
.stabs .sp{flex:1}
.sbody>.fileh{position:sticky;top:0;z-index:3}
.fileh{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid var(--border);font:12px var(--font-mono);color:var(--fg-2);flex:none;background:var(--code-bg);min-width:0}
.fileh .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fileh .p .d{color:var(--faint)}
.fileh .sp{flex:1}
.fileh .tag{font:600 10.5px var(--font-sans);padding:2px 6px;border-radius:4px;background:var(--ok-bg);color:var(--ok)}
.fileh .tag.pin{background:var(--accent-bg);color:var(--accent-fg)}
.fileh .tag.diff{background:var(--ai-bg);color:var(--ai)}
.sbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;position:relative}
.code{font:12px/19px var(--font-mono);min-width:max-content;padding:6px 0 40px;tab-size:4}
.cl{display:grid;grid-template-columns:52px 18px minmax(0,1fr);min-height:19px;position:relative}
.cl .no{color:var(--faint);text-align:right;padding-right:10px;user-select:none;background:var(--code-gut);font-variant-numeric:tabular-nums}
.cl .bk{display:grid;place-items:center;user-select:none}
.cl .bk i{width:2px;height:19px;border-radius:0;background:var(--accent);opacity:.28;cursor:pointer}
.cl .bk i:hover{opacity:1;width:3px}
.cl .tx{white-space:pre;padding:0 18px 0 4px;color:var(--fg-2)}
.cl.hl{background:var(--hl)}
.cl.hl .no{color:var(--accent-fg);box-shadow:inset 2px 0 0 var(--hl-edge);background:var(--hl)}
.cl.add{background:var(--add)} .cl.add .no{background:var(--add-strong);color:var(--ok)}
.cl.del{background:var(--del)} .cl.del .no{background:var(--del-strong);color:var(--err)}
.cl.add .bk::before{content:"+";color:var(--ok)} .cl.del .bk::before{content:"−";color:var(--err)}
.cl .no2{display:none}
.gap{display:flex;align-items:center;gap:8px;height:26px;padding-left:70px;font:11.5px var(--font-sans);color:var(--faint);background:var(--bg-2);border-block:1px solid var(--border);margin:2px 0}
.gap:hover{color:var(--accent-fg);cursor:pointer}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com)} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-ty{color:var(--tk-ty)} .tk-h{color:var(--tk-h);font-weight:700}
.backref{position:absolute;right:10px;font:600 10px/16px var(--font-sans);padding:0 6px;border-radius:8px;background:var(--accent-bg);color:var(--accent-fg);cursor:pointer;margin-top:1px;z-index:1}
.sfoot{white-space:nowrap;overflow:hidden;height:30px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--border);font:11px var(--font-mono);color:var(--faint);background:var(--bg-2);flex:none}
.sfoot .sp{flex:1}

/* side: review */
.rv-h{padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--bg-2)}
.rv-h .t{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650}
.rv-h .t .sp{flex:1}
.rv-files{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.rv-files a{display:flex;align-items:center;gap:8px;font:11.5px var(--font-mono);color:var(--fg-2);text-decoration:none;padding:3px 6px;border-radius:5px}
.rv-files a:hover{background:var(--hover)}
.rv-files .a{color:var(--ok)} .rv-files .d{color:var(--err)}
.hunk{border-bottom:1px solid var(--border)}
.hunk-h{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 12px;font:11.5px var(--font-mono);color:var(--muted);background:var(--raise-2);position:sticky;top:34px;z-index:2;border-bottom:1px solid var(--border)}
.hunk-h .sp{flex:1}
.hunk.cur .hunk-h{box-shadow:inset 2px 0 0 var(--accent);color:var(--fg-2)}
.hunk.acc .hunk-h::after{content:"採用";font:600 10.5px var(--font-sans);color:var(--ok);margin-left:6px}
.hunk.rej{opacity:.45}
.hunk.rej .hunk-h::after{content:"却下";font:600 10.5px var(--font-sans);color:var(--err);margin-left:6px}
.hbtn{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--border-2);background:var(--panel)}
.hbtn:hover{color:var(--fg)} .hbtn.ok:hover{color:var(--ok);border-color:var(--ok)} .hbtn.no:hover{color:var(--err);border-color:var(--err)}
.rv-foot{border-top:1px solid var(--border);padding:10px 12px;background:var(--bg-2);display:grid;gap:8px;flex:none}
.rv-foot .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv-foot .sp{flex:1}

/* side: thread list / jobs */
.slist{padding:8px}
.sitem{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 8px;padding:9px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;align-items:start}
.sitem:hover{background:var(--hover)}
.sitem.sel{background:var(--accent-bg);border-color:transparent}
.sitem .t{font-size:13px;color:var(--fg);line-height:1.45}
.sitem .m{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:11px var(--font-mono);color:var(--muted)}
.sitem .r{font:11px var(--font-mono);color:var(--faint);white-space:nowrap}
.sgi{width:18px;height:18px;display:grid;place-items:center;margin-top:1px}
.sgi svg{width:14px;height:14px}

/* ---------- status bar ---------- */
.status{display:flex;align-items:center;gap:12px;padding:0 10px;font:11.5px var(--font-mono);color:var(--muted);border-top:1px solid var(--border);background:var(--bg-2);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.status .sep{width:1px;height:12px;background:var(--border-2);flex:none}
.status .it{display:flex;align-items:center;gap:6px}
.status .sp{flex:1}
.status button{display:flex;align-items:center;gap:6px;height:20px;padding:0 6px;border-radius:4px}
.status button:hover{background:var(--hover);color:var(--fg)}
.status b{color:var(--fg-2);font-weight:500}
.gpend{color:var(--accent-fg);display:none} .gpend.on{display:inline}
.meter{width:42px;height:4px;border-radius:2px;background:var(--border-2);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--ok)}

/* ---------- popovers / overlays ---------- */
#peek{position:fixed;z-index:40;width:540px;max-width:calc(100vw - 24px);background:var(--raise);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow);display:none;overflow:hidden}
#peek.on{display:block;animation:thIn .12s var(--ease)}
#peek .ph{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border-bottom:1px solid var(--border);font:12px var(--font-mono);color:var(--fg-2);background:var(--bg-2)}
#peek .ph .sp{flex:1}
#peek .pb{max-height:260px;overflow:auto;background:var(--code-bg)}
#peek .pf{display:flex;gap:12px;align-items:center;height:30px;padding:0 12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);background:var(--bg-2)}
#peek .pf .sp{flex:1}
.prec{font:600 10.5px var(--font-sans);padding:2px 6px;border-radius:4px;background:var(--ok-bg);color:var(--ok)}
.prec.s{background:var(--warn-bg);color:var(--warn)}
#gcard{position:fixed;z-index:41;width:340px;background:var(--raise);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow);display:none;padding:12px 14px}
#gcard.on{display:block;animation:thIn .12s var(--ease)}
#gcard .gt{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:650}
#gcard .gy{font-size:12px;color:var(--muted);font-weight:500}
#gcard .ge{font:11.5px var(--font-mono);color:var(--muted);margin:2px 0 6px}
#gcard .gd{font-size:13px;line-height:1.7;color:var(--fg-2)}
#gcard .gf{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted)}
#ecard{position:fixed;z-index:41;width:300px;background:var(--raise);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow);display:none;padding:10px 12px;font:12px var(--font-mono);color:var(--fg-2)}
#ecard.on{display:block}
#ecard .row{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}
#ecard .row span:first-child{font-family:var(--font-sans);color:var(--muted)}
#ecard .tot{border-top:1px solid var(--border);margin-top:4px;padding-top:6px;font-weight:650;color:var(--fg)}
#ecard .nt{font-family:var(--font-sans);font-size:11px;color:var(--faint);margin-top:6px;line-height:1.5}

.ovl{position:fixed;inset:0;z-index:50;display:none}
.ovl.on{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.pal{position:absolute;left:50%;top:11vh;width:min(660px,calc(100vw - 32px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--border-2);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;animation:palIn .15s var(--ease)}
@keyframes palIn{from{opacity:0;transform:translate(-50%,-6px) scale(.985)}to{opacity:1;transform:translate(-50%,0)}}
.pal-in{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;font:16px var(--font-sans);background:transparent;border:0;outline:0;color:var(--fg)}
.pal-in input::placeholder{color:var(--faint)}
.pal-in .crumb{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--accent-bg);color:var(--accent-fg);white-space:nowrap}
.pal-list{max-height:min(430px,60vh);overflow:auto;padding:6px}
.pal-gh{font-size:11px;font-weight:600;color:var(--faint);padding:9px 10px 4px;letter-spacing:.05em}
.pal-it{height:42px;display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:0 10px;border-radius:8px;cursor:pointer}
.pal-it[aria-selected="true"]{background:var(--accent-bg)}
.pal-it .pi{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--raise-2);color:var(--muted);border:1px solid var(--border)}
.pal-it .pi svg{width:13px;height:13px}
.pal-it .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:var(--fg)}
.pal-it .pl .al{font-size:12px;color:var(--muted);margin-left:6px}
.pal-it .pl mark{background:transparent;color:var(--accent-fg);font-weight:650}
.pal-it .pm{font:11.5px var(--font-mono);color:var(--faint);white-space:nowrap}
.pal-it[aria-selected="true"] .pm{color:var(--muted)}
.pal-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}
.pal-foot{height:36px;display:flex;gap:16px;align-items:center;padding:0 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);background:var(--bg-2)}
.pal-foot .sp{flex:1}
.pal-foot span{display:flex;gap:5px;align-items:center}
.help{position:absolute;left:50%;top:7vh;width:min(860px,calc(100vw - 32px));transform:translateX(-50%);max-height:84vh;overflow:auto;background:var(--raise);border:1px solid var(--border-2);border-radius:var(--r-l);box-shadow:var(--shadow);padding:16px 20px 18px;animation:palIn .15s var(--ease)}
.help h3{margin:0 0 2px;font-size:15px}
.help .hs{font-size:12px;color:var(--muted);margin-bottom:12px}
.help .cols{columns:3 240px;column-gap:26px}
.help .grp{break-inside:avoid;margin-bottom:14px}
.help .grp h4{font-size:11px;letter-spacing:.06em;color:var(--faint);margin:0 0 6px}
.help .kr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:3px 0;color:var(--fg-2)}
.help .kr span:last-child{display:flex;gap:3px}
#toasts{position:fixed;left:50%;bottom:calc(var(--status-h) + 16px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{pointer-events:auto;min-width:340px;max-width:min(640px,calc(100vw - 24px));display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;background:var(--toast-bg);color:var(--toast-fg);border-radius:10px;box-shadow:var(--shadow);font-size:13px;position:relative;overflow:hidden;animation:toastIn .18s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast .tm{font:11.5px var(--font-mono);opacity:.65}
.toast .sp{flex:1}
.toast button{white-space:nowrap;flex:none;height:26px;padding:0 9px;border-radius:6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;background:rgba(127,127,127,.18)}
.toast button:hover{background:rgba(127,127,127,.3)}
.toast kbd{background:transparent;color:inherit;border-color:rgba(127,127,127,.5);height:16px}
.toast .tb{position:absolute;left:0;bottom:0;height:2px;background:var(--ok);width:100%;transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{to{transform:scaleX(0)}}
.toast .ok{color:var(--ok)}
.jobpanel{position:fixed;z-index:45;top:calc(var(--top-h) + 4px);width:440px;background:var(--raise);border:1px solid var(--border-2);border-radius:var(--r-l);box-shadow:var(--shadow);display:none;overflow:hidden}
.jobpanel.on{display:block;animation:thIn .12s var(--ease)}
.jp-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:650}
.jp-h .sp{flex:1}
.jp-h .muted{font-weight:500}
.jp-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center}
.jp-row .t{font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jp-row .d{grid-column:2/-1;font:11px var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jp-row .c{font:11.5px var(--font-mono);color:var(--fg-2);white-space:nowrap}
.jp-f{display:flex;align-items:center;gap:10px;padding:9px 12px;font:11.5px var(--font-mono);color:var(--muted);background:var(--bg-2)}
.jp-f .sp{flex:1}

/* ---------- scan / map view ---------- */
.scan{padding:18px 22px 60px;max-width:1100px}
.scan-h{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.scan-h h1{font-size:19px;margin:0;font-weight:650}
.scan-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 14px}
.maptools{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.maptools .sp{flex:1}
.mapwrap{padding-bottom:26px;border:1px solid var(--border);border-radius:10px;background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;position:relative;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.mapcap{position:absolute;left:12px;bottom:9px;font:11px var(--font-mono);color:var(--faint)}
.maplegend{position:absolute;right:12px;bottom:8px;display:flex;gap:12px;font-size:11px;color:var(--muted);align-items:center}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.node{cursor:pointer}
.node .bx{fill:var(--raise);stroke:var(--border-2);stroke-width:1}
.node:hover .bx,.node:focus .bx{stroke:var(--accent);stroke-width:1.5}
.node:focus{outline:none}
.node.ext .bx{fill:transparent;stroke-dasharray:4 3}
.node .nt{font:600 12px var(--font-mono);fill:var(--fg)}
.node .ns{font:11.5px var(--font-sans);fill:var(--muted)}
.node .nj{font:600 12.5px var(--font-sans);fill:var(--fg)}
.node .lb{fill:var(--border-2)} .node .lf{fill:var(--accent);opacity:.8}
.node .hot{fill:var(--warn)}
.node .cbadge rect{fill:var(--ai-bg);stroke:none} .node .cbadge text{font:700 10px var(--font-mono);fill:var(--ai)}
.node.working .bx{stroke:var(--ai);stroke-width:1.6}
.node .ring{fill:none;stroke:var(--ai);stroke-width:1.5;opacity:.0}
.node.working .ring{animation:ringp 1.8s ease-in-out infinite}
@keyframes ringp{0%,100%{opacity:.0}50%{opacity:.55}}
.zone{fill:none;stroke:var(--border-2);stroke-dasharray:3 4;stroke-width:1}
.zl{font:600 10px var(--font-sans);fill:var(--faint);letter-spacing:.08em}
.edge{fill:none;stroke:var(--faint);stroke-width:1.15;opacity:.85}
.edge.hot{stroke:var(--accent);stroke-width:1.6;opacity:1}
.el{font:10.5px var(--font-sans);fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.arrow{fill:var(--faint)}
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;margin-top:12px}
.fcard{border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden;min-width:0}
.fcard h3{display:flex;align-items:center;gap:8px;margin:0;padding:9px 12px;font-size:12px;font-weight:650;color:var(--fg-2);border-bottom:1px solid var(--border);background:var(--bg-2)}
.fcard h3 .sp{flex:1}
.fcard h3 .src{font:500 10.5px var(--font-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.fcard h3{white-space:nowrap}
.fcard table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.fcard td{overflow:hidden;text-overflow:ellipsis}
.fcard td.l{overflow-wrap:anywhere}
.fcard td{padding:5px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.fcard tr:last-child td{border-bottom:0}
.fcard td:first-child{font-family:var(--font-mono);color:var(--fg-2);white-space:nowrap}
.fcard td:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fcard td.l{text-align:left!important;white-space:normal!important}
.fcard .more{padding:6px 12px;font-size:11.5px;color:var(--faint)}
.langbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 12px 6px;gap:1px}
.langbar i{display:block;height:100%}
.zero{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font:600 11.5px var(--font-mono)}

/* estimate card (side in scan) */
.genpane{padding:14px;display:grid;gap:12px;align-content:start}
.ecard{border:1px solid var(--border-2);border-radius:12px;background:var(--panel);box-shadow:var(--shadow-s);overflow:hidden}
.ecard .eh{padding:12px 14px 4px;display:flex;align-items:center;gap:8px}
.ecard .eh h2{font-size:14px;margin:0;font-weight:650}
.ecard .eh .sp{flex:1}
.ecard .ed{padding:0 14px 10px;font-size:12.5px;color:var(--muted);line-height:1.6}
.efforts{display:grid;gap:6px;padding:0 10px 10px}
.eff{display:grid;grid-template-columns:18px 1fr auto;gap:2px 10px;align-items:center;padding:9px 10px;border:1px solid var(--border);border-radius:9px;cursor:pointer;background:var(--bg)}
.eff:hover{border-color:var(--border-2)}
.eff[aria-checked="true"]{border-color:var(--accent);background:var(--accent-bg-weak);box-shadow:0 0 0 1px var(--accent)}
.eff .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center}
.eff[aria-checked="true"] .rd{border-color:var(--accent)}
.eff[aria-checked="true"] .rd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.eff .n{font-size:13px;font-weight:650;display:flex;gap:8px;align-items:center}
.eff .n .def{font:600 10px var(--font-sans);padding:1px 6px;border-radius:4px;background:var(--accent-bg);color:var(--accent-fg)}
.eff .v{font:12px var(--font-mono);color:var(--fg-2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.eff .x{grid-column:2/-1;font-size:11.5px;color:var(--muted)}
.ebig{margin:2px 14px 8px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border-2);font:14px var(--font-sans);color:var(--fg);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.ebig .eq{flex:1;white-space:nowrap}
.ebig .btn{height:30px}
.ebig b{font-weight:700}
.ebig .s{color:var(--faint)}
.ebd{margin:0 14px 10px;font:11.5px var(--font-mono);color:var(--muted);display:grid;gap:3px}
.ebd .row{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;font-variant-numeric:tabular-nums}
.ebd .row span:first-child{font-family:var(--font-sans)}
.ebd .row.h{color:var(--faint);font-size:10.5px}
.eng{display:grid;gap:5px;padding:0 14px 10px}
.eng label{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);cursor:pointer;padding:4px 0}
.eng label .en{display:flex;flex-direction:column;line-height:1.35}
.eng label .en span{font-size:11.5px;color:var(--muted)}
.eng label .d{font:11px var(--font-mono);color:var(--muted);white-space:nowrap}
.eng input{accent-color:var(--accent);margin:0}
.efoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg-2)}
.efoot .sp{flex:1}
.policy{font-size:11.5px;color:var(--muted);line-height:1.6;padding:0 14px 12px}
.policy b{color:var(--fg-2);font-weight:600}
.cov{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:10px 12px;font-size:12px;color:var(--muted);display:grid;gap:6px}
.cov .row{display:flex;justify-content:space-between}
.cov b{font:500 12px var(--font-mono);color:var(--fg-2)}
.gstages{list-style:none;margin:0;padding:4px 14px 10px;display:grid;gap:7px}
.gstages li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.gstages li .m{font:11.5px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.gstages li .sub{grid-column:2/-1;font:11px var(--font-mono);color:var(--faint);margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstages .bar{grid-column:2/-1}
.gstages .bar>i{background:var(--ai);transition:width .3s var(--ease)}

/* ---------- inbox ---------- */
.inbox{display:flex;flex-direction:column;height:100%}
.ib-h{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.ib-h h1{font-size:17px;margin:0;font-weight:650}
.ib-h .sp{flex:1}
.ib-f{display:flex;gap:6px;padding:0 18px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);background:var(--panel)}
.fbtn:hover{color:var(--fg)}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fbtn .c{font:600 10.5px var(--font-mono);opacity:.75}
.batchbar{display:flex;align-items:center;gap:10px;margin:10px 18px 0;padding:8px 10px 8px 12px;border-radius:9px;border:1px solid var(--border-2);background:var(--ai-bg);font-size:12.5px;color:var(--fg-2)}
.batchbar .sp{flex:1}
.batchbar .mono{font-size:12px}
.ib-list{padding:6px 10px 40px}
.ib-g{font-size:11px;font-weight:650;color:var(--faint);letter-spacing:.06em;padding:12px 10px 4px;display:flex;gap:8px}
.ib-row{display:grid;grid-template-columns:22px 52px minmax(0,1fr) auto auto 64px;gap:10px;align-items:center;height:40px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:13px}
.ib-row:hover{background:var(--hover)}
.ib-row.sel{background:var(--accent-bg)}
.ib-row .id{font:11px var(--font-mono);color:var(--faint)}
.ib-row .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.ib-row .ti .an{font:11.5px var(--font-mono);color:var(--muted);margin-left:8px}
.ib-row .in{font-size:11.5px;color:var(--muted);padding:1px 7px;border-radius:5px;border:1px solid var(--border);white-space:nowrap}
.ib-row .co{font:11.5px var(--font-mono);color:var(--fg-2);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ib-row .ag{font:11.5px var(--font-mono);color:var(--faint);text-align:right;white-space:nowrap}
.ib-row .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border-2);display:none}
.ib-row.chk .ck{display:block;background:var(--accent);border-color:var(--accent)}
.detail{padding:14px 16px;display:grid;gap:12px;align-content:start}
.detail h2{font-size:15px;margin:0;line-height:1.5}
.dmeta{display:flex;flex-wrap:wrap;gap:6px}
.errbox{border:1px solid var(--err-bg);background:var(--err-bg);border-radius:8px;padding:9px 11px;font:11.5px/1.6 var(--font-mono);color:var(--fg-2)}
.errbox b{color:var(--err)}

/* ---------- tablet / narrow ---------- */
.mob-only{display:none}
@media (max-width:1439px){ :root{--side-w:440px;--rail-w:232px;--side-map:380px} .kbtn{width:170px} }
@media (max-width:1279px){ .crumbs{display:none} .chip.cost .lbl{display:none} }
@media (max-width:1023px){
  .main{grid-template-columns:minmax(0,1fr)!important}
  .rail{position:fixed;top:var(--top-h);bottom:var(--status-h);left:0;width:300px;z-index:35;transform:translateX(-102%);transition:transform .18s var(--ease);box-shadow:var(--shadow);visibility:visible!important}
  #app.rail-open .rail{transform:none}
  .splitter{display:none}
  .side{position:fixed;left:0;right:0;bottom:var(--status-h);height:52px;z-index:34;border-top:1px solid var(--border-2);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12);transition:height .22s var(--ease);visibility:visible!important;overflow:hidden}
  #app.sheet-half .side{height:50vh} #app.sheet-full .side{height:88vh}
  .sheet-grip{display:flex!important;justify-content:center;align-items:center;height:14px;flex:none;cursor:ns-resize}
  .sheet-grip i{width:36px;height:4px;border-radius:2px;background:var(--border-2)}
  .stabs{border-radius:14px 14px 0 0}
  .doc{padding:20px 24px 140px 24px;max-width:690px}
  .btools{left:auto;right:6px;top:-14px;flex-direction:row}
  .ws .br,.chip.jobs .lbl,.chip.cost{display:none!important}
  .gut{display:none}
  .mob-only{display:inline-flex}
  .desk-only{display:none!important}
  .top{gap:8px}
  .seg button{padding:0 8px}
  .kbtn{width:auto}
  .kbtn span,.kbtn kbd{display:none}
  .chip.cost .lbl,.chip.u5 .lbl{display:none}
  .facts-grid{grid-template-columns:1fr 1fr}
  .status .hide-sm{display:none}
}
.sheet-grip{display:none}
@media (max-width:600px){ .facts-grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .blk.working{box-shadow:0 0 0 1px var(--ai)}
  .blk.flash{box-shadow:inset 3px 0 0 var(--ok)}
}
@media print{ .top,.rail,.side,.splitter,.status{display:none} body{overflow:visible} }

.gcount{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 10px;margin:2px 14px 10px;padding:9px 12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border-2);font-variant-numeric:tabular-nums}
.gcount span{font-size:10.5px;color:var(--faint)}
.gcount b{font:600 14px var(--font-mono);color:var(--fg);white-space:nowrap}
.gcount i{font:normal 11px var(--font-mono);color:var(--faint);white-space:nowrap}

</style>

ing) {", "\t// Parent on the daemon shutdown ctx so SIGINT/SIGTERM kills", "\t// the agent subprocess instead of orphaning it (the subprocess has its", "\t// own session id via daemonSysProcAttr). Tests that don't wire a shutdown", "\t// ctx fall back to context.Background() — same behavior as before.", "\tctx, cancel := context.WithTimeout(s.effectiveCtx(), 10*time.Minute)", "\tdefer cancel()", "", "\tparts := strings.Fields(s.agentCmd)", "\tif len(parts) == 0 {", "\t\treturn", "\t}", "\tlog.Printf(\"agent-request %s: running %q\", commentID, s.agentCmd)", "", "\t// Replace {prompt} placeholder with the actual prompt as a single argument.", "\thasPlaceholder := false", "\tfor i, p := range parts {", "\t\tif p == \"{prompt}\" {", "\t\t\tparts[i] = prompt", "\t\t\thasPlaceholder = true", "\t\t}", "\t}", "", "\tcmd := exec.CommandContext(ctx, parts[0], parts[1:]...)", "\tif !hasPlaceholder {", "\t\tcmd.Stdin = strings.NewReader(prompt)", "\t}", "\tsess := s.session.Load()", "\tcmd.Dir = sess.RepoRoot", "", "\tvar stdout, stderr bytes.Buffer", "\tcmd.Stdout = &stdout", "\tcmd.Stderr = &stderr", "", "\terr := cmd.Run()", "\tif err != nil {", "\t\tlog.Printf(\"agent-request %s: error: %v\\nStderr: %s\", commentID, err, stderr.String())", "\t\treturn", "\t}", "", "\tresponse := strings.TrimSpace(stdout.String())", "\tif response == \"\" {", "\t\tlog.Printf(\"agent-request %s: completed (no output)\", commentID)"]}]}, "internal/session/watch.go": {"total": 1221, "segs": [{"s": 320, "lines": ["// Git status polling only runs during the \"waiting for agent\" phase (between", "// POST /api/finish and POST /api/round-complete). mergeExternalCritJSON runs", "// on every tick since it only uses os.Stat.", "func (s *Session) watchGit(stop <-chan struct{}) {", "\tticker := time.NewTicker(1 * time.Second)", "\tdefer ticker.Stop()", ""]}, {"s": 464, "lines": ["func carryForwardComment(old Comment, now string) Comment {", "\tc := Comment{", "\t\tID:          old.ID,", "\t\tStartLine: horLen == 0 || len(lines) < anchorLen {", "\t\treturn 0", "\t}", "", "\tvar matches []int", "\tfor i := 0; i <= len(lines)-anchorLen; i++ {", "\t\tcandidate := strings.Join(lines[i:i+anchorLen], \"\\n\")", "\t\tif candidate == anchor {", "\t\t\tmatches = append(matches, i+1) // 1-indexed", "\t\t}", "\t}", "", "\tif len(matches) == 0 {", "\t\treturn 0", "\t}", "\tif len(matches) == 1 {", "\t\treturn matches[0]", "\t}", "", "\t// Multiple matches: pick closest to the LCS-suggested position.", "\tbest := matches[0]", "\tbestDist := abs(best - preferredStart)", "\tfor _, m := range matches[1:] {", "\t\td := abs(m - preferredStart)", "\t\tif d < bestDist {", "\t\t\tbest = m", "\t\t\tbestDist = d", "\t\t}", "\t}", "\treturn best", "}", "", "func abs(x int) int {", "\tif x < 0 {", "\t\treturn -x", "\t}", "\treturn x", "}", "", "// verifyAndCorrectPosition checks whether the LCS-remapped position still", "// points at the anchor text. If not, it searches the new content for the anchor.", "// Returns the corrected (start, end) and whether the comment has drifted.", "func verifyAndCorrectPosition(newLines []string, anchor string, lcsStart, lcsEnd int) (start, end, drifted int) {", "\tanchorLines := strings.Split(anchor, \"\\n\")", "\tanchorLen := len(anchorLines)", "", "\t// Check if the LCS position still matches.", "\tif lcsStart >= 1 && lcsStart+anchorLen-1 <= len(newLines) {", "\t\tcandidate := strings.Join(newLines[lcsStart-1:lcsStart+anchorLen-1], \"\\n\")", "\t\tif candidate == anchor {", "\t\t\treturn lcsStart, lcsStart + anchorLen - 1, 0", "\t\t}", "\t\t// Edited-but-recognizable: if LCS predicts the same row and the line", "\t\t// is still close enough to the original, treat as anchored. Avoids", "\t\t// false drift when text was appended/trimmed/tweaked in place.", "\t\tif anchorSimilar(candidate, anchor) {", "\t\t\treturn lcsStart, lcsStart + anchorLen - 1, 0", "\t\t}", "\t}", "", "\t// LCS position doesn't match — search the entire file.", "\tfound := findAnchorInLines(newLines, anchor, lcsStart)", "\tif found > 0 {", "\t\treturn found, found + anchorLen - 1, 0", "\t}", "", "\t// Anchor not found anywhere — mark drifted, keep LCS position.", "\treturn lcsStart, lcsEnd, 1", "}", "", "// anchorSimilar reports whether candidate and anchor are close enough to", "// treat the comment as still anchored. Catches in-place edits (appended,", "// trimmed, or lightly reworded text) that exact match would flag as drifted.", "func anchorSimilar(candidate, anchor string) bool {", "\ta := strings.TrimSpace(candidate)", "\tb := strings.TrimSpace(anchor)", "\tif a == b {", "\t\treturn true", "\t}", "\tif a == \"\" || b == \"\" {", "\t\treturn false", "\t}", "\t// Common case: text was appended to or trimmed from the anchor line, or a", "\t// single clause was cut out of its middle — the shapes an agent leaves", "\t// when it edits a line in place. Both require the deleted text to be", "\t// contiguous, which is what keeps unrelated lines that merely share", "\t// scattered characters from matching.", "\t// Gate on a minimum length so trivial anchors (`}`, `return nil`) don't", "\t// match any longer line that happens to contain them.", "\tshorter, longer := a, b", "\tif len(longer) < len(shorter) {", "\t\tshorter, longer = longer, shorter", "\t}", "\tif len(shorter) >= 8 && (strings.Contains(longer, shorter) || oneMiddleCut(shorter, longer)) {", "\t\treturn true", "\t}", "\treturn levenshteinRatio(a, b) >= 0.7", "}", "", "// oneMiddleCut reports whether short can be produced from long by deleting a", "// single contiguous run from the middle, leaving long's opening and closing"]}, {"s": 1044, "lines": ["func levenshteinRatio(a, b string) float64 {", "\tar, br := []rune(a), []rune(b)", "\tla, lb := len(ar), len(br)", "\tif la == 0 && lb == 0 {", "\t\treturn 1", "\t}", "\tmaxLen := la", "\tif lb > maxLen {", "\t\tmaxLen = lb", "\t}", "\td := levenshtein(ar, br)", "\treturn 1 - float64(d)/float64(maxLen)", "}", "", "// levenshtein computes edit distance between two rune slices using a"]}, {"s": 1098, "lines": ["func remapLines(lineMap map[int]int, oldStart, oldEnd, maxLine int) (int, int) {", "\ts := lineMap[oldStart]", "\te := lineMap[oldEnd]", "\tif s == 0 {", "\t\ts = oldStart", "\t}", "\tif e == 0 {", "\t\te = oldEnd", "\t}", "\tif s > maxLine {", "\t\ts = maxLine", "\t}", "\tif e > maxLine {", "\t\te = maxLine", "\t}", "\tif s < 1 {", "\t\ts = 1", "\t}", "\tif e < s {", "\t\te = s", "\t}", "\treturn s, e", "}", "", "// carryForwardComments maps comments from the previous round to new document", "// positions using LCS line mapping + anchor verification. Works for all file", "// types (markdown and code) that have PreviousContent and PreviousComments.", "// Files without PreviousContent are left for carryForwardAllComments."]}]}, "internal/session/session_write.go": {"total": 701, "segs": [{"s": 11, "lines": ["// scheduleWrite debounces writes to disk.", "// scheduleWrite must be called with s.mu held.", "func (s *Session) scheduleWrite() {", "\ts.pendingWrite = true", "\tif s.writeTimer != nil {", "\t\ts.writeTimer.Stop()", "\t}", "\tgen := s.writeGen", "\ts.writeTimer = time.AfterFunc(200*time.Millisecond, func() {", "\t\t// Serialize debounced writes with ClearAllComments so a stale", "\t\t// in-flight write cannot recreate the review file after we've", "\t\t// deleted it. ClearAllComments bumps writeGen under writeMu, so"]}]}, "internal/diff/diff.go": {"total": 338, "segs": [{"s": 33, "lines": ["", "// ComputeLineDiff computes a line-level diff between oldContent and newContent", "// using Hirschberg's algorithm (divide-and-conquer LCS in O(n) space).", "// Each line is classified as \"unchanged\", \"added\", or \"removed\".", "func ComputeLineDiff(oldContent, newContent string) []DiffEntry {", "\toldLines := SplitLines(oldContent)", "\tnewLines := SplitLines(newContent)", "\treturn hirschbergDiff(oldLines, newLines, 0, 0)", "}", "", "// hirschbergDiff computes the diff between old[0:len(old)] and new[0:len(new)]", "// using Hirschberg's divide-and-conquer algorithm. oldOff and newOff are the", "// 0-based offsets into the original arrays, used to compute 1-based line numbers.", "func hirschbergDiff(old, new []string, oldOff, newOff int) []DiffEntry {"]}, {"s": 190, "lines": ["// lines it maps to the nearest subsequent new line in the new document.", "// Returns a map[int]int where key=old line, value=new line.", "func MapOldLineToNew(entries []DiffEntry) map[int]int {", "\tm := make(map[int]int)", "\t// First pass: map all unchanged lines directly", "\tfor _, e := range entries {", "\t\tif e.Type == \"unchanged\" {", "\t\t\tm[e.OldLine] = e.NewLine", "\t\t}", "\t}", "\t// Second pass (reverse): for removed lines, find the next new line after them."]}]}, "internal/story/ingest.go": {"total": 311, "segs": [{"s": 25, "lines": ["// placedFloor is the minimum fraction of indexed hunks a story must place for", "// omissions to be auto-repaired rather than rejected. Below it, the story is", "// treated as drift or hallucination (§8).", "const placedFloor = 0.5"]}, {"s": 112, "lines": ["// Order is strict: drift check first, then duplicates, then the placed floor.", "// It mutates in.Story in place when the outcome is a save. The returned Result", "// always carries a Coverage report.", "func Run(in Ingest) (Result, error) {", "\tcoverage := &session.StoryCoverage{Indexed: len(in.Indexed)}", "\tnormalizeStory(in.Story)", "\tif err := ValidateShape(in.Story); err != nil {", "\t\treturn Result{Coverage: coverage}, err", "\t}", "", "\t// 1. Drift check first. A mismatch means the working tree moved since prep.", "\tif in.Story.ScopeFingerprint != \"\" && in.LiveFingerprint != \"\" &&", "\t\tin.Story.ScopeFingerprint != in.LiveFingerprint {", "\t\treturn Result{Coverage: coverage}, ErrDrift", "\t}", "", "\tindexedSet := make(map[HunkID]struct{}, len(in.Indexed))", "\tfor _, h := range in.Indexed {", "\t\tindexedSet[h] = struct{}{}", "\t}", "", "\t// Pre-place ignored files into support[] with reason \"ignored\" BEFORE the", "\t// coverage math. They count as placed and are never treated as missing.", "\tprePlaceIgnored(in.Story, in.Ignored)", "", "\t// 2. Tally placed hunks and detect duplicates (a hunk referenced by >=2", "\t// chapters, or by a chapter and a support entry).", "\tplacedSet, duplicated := tallyPlacement(in.Story, indexedSet)", "\tcoverage.Placed = len(placedSet)", "", "\t// 3. Duplicates -> strict reject.", "\tif len(duplicated) > 0 {", "\t\tcoverage.Duplicated = idStrings(duplicated)", "\t\treturn Result{Coverage: coverage}, ErrDuplicate", "\t}", "", "\t// Compute missing = indexed - placed.", "\tvar missing []HunkID", "\tfor _, h := range in.Indexed {", "\t\tif _, ok := placedSet[h]; !ok {", "\t\t\tmissing = append(missing, h)", "\t\t}", "\t}", "", "\t// 4. Missing -> repair with a floor.", "\tif len(missing) > 0 {", "\t\tif len(in.Indexed) == 0 || float64(coverage.Placed)/float64(len(in.Indexed)) < placedFloor {", "\t\t\tcoverage.Missing = idStrings(missing)", "\t\t\treturn Result{Coverage: coverage}, ErrBelowFloor", "\t\t}", "\t\tbackfillSupport(in.Story, missing, ReasonAutoRepaired)", "\t\tcoverage.Missing = idStrings(missing)", "\t\tcoverage.AutoRepaired = true", "\t}", "", "\t// 5. ok is true only when the story saved with zero repairs.", "\tcoverage.OK = !coverage.AutoRepaired", "\tin.Story.Coverage = coverage", "\treturn Result{Saved: true, Coverage: coverage}, nil"]}]}, "integrations/prompts/on_story_generate.md": {"total": 116, "segs": [{"s": 28, "lines": ["   hierarchy or a request flow). At most one diagram per story; most stories", "   have none.", "7. **Use the given hunk refs only.** Never invent or re-quote diff text —", "   reference hunks only via the `(file_path, old_start)` pairs listed in the", "   prep file. Never renumber or reformat them.", "8. **Outside-in order is a useful default, not a rule.** When it helps", "   readability, order chapters from the outermost/user-facing layer inward"]}]}, "README.md": {"total": 525, "segs": [{"s": 8, "lines": ["Review and comment on plans, code diffs, frontend elements and send feedback directly to your agent.", "", "![Crit UI for \"notification-plan.md\" showing comment left on \"Queue - Redis Streams, SQS, RabbitMQ\" line saying \"Just use SQS - we're in AWS\"](docs/images/demo-overview.png)", "", "## Adaptive UI for each type of output", "", "For agents, plans and code are all the same - it's just text, but for us, humans, reviewing generated plans and reviewing web application are two very different activities.", "", "Crit adds a proper interface for each type of output and lets you point at the exact thing that is wrong and leave a comment for the agent to fix:", "", "- `crit plan.md` renders a markdown file with proper formatting and review UI", "- `crit` auto-detects git changes and shows syntax-highlighted diffs for local review.", "- `crit http://localhost:3000` proxies your running app and adds a review interface to it", "- `crit landing.html` renders a static HTML artifact to review", "", "Everything runs locally via one single binary.", ""]}]}, "AGENTS.md": {"total": 436, "segs": [{"s": 28, "lines": ["## Key architecture decisions", "", "1. **All frontend assets embedded** via Go's `embed.FS` — produces a true single binary", "2. **No frontend build step** — vanilla JS, no npm/webpack/framework. npm is only for fetching vendor libs.", "3. **Two modes**: \"git\" mode (auto-detect from git) and \"files\" mode (explicit file arguments)", "4. **markdown-it for parsing** — chosen because it provides `token.map` (source line mappings per block)", "5. **Block-level splitting** — lists, code blocks, tables, blockquotes split into per-item/per-line/per-row blocks so each source line is independently commentable", "6. **Diff rendering is `@pierre/diffs`** — the review list (git and files mode) is one Pierre `CodeView`: virtualization, sticky headers, Shiki highlighting in a worker pool, word diffs, split/unified, context expansion. Crit supplies the file header, comments/forms as annotations, keyboard focus and jumps. Rendered markdown (Document view) is Crit's line-block document inside a Pierre item. Story chapters use Pierre `FileDiff`. See `docs/frontend-js.md`.", "7. **Comments reference source line numbers** — stored in `~/.crit/reviews/<key>.json` with per-file sections", "8. **Real-time output** — review file written on every comment change (200ms debounce)", "9. **File watching** — git mode polls `git status --porcelain`; files mode polls mtimes; reloads via SSE", "10. **Localhost by default** — server binds to `127.0.0.1` (no CORS headers needed). Non-loopback `--host` / `CRIT_HOST` / global `host`, or any `public_url`, require `--allow-unauthenticated-network` / `CRIT_ALLOW_UNAUTHENTICATED_NETWORK=1` (Crit has no network auth).", "11. **Two-level config** — `~/.crit.config.json` (global) merged with `.crit.config.json` (project), CLI flags override both. `agent_cmd`, `auth_token`, `share_url`, and `plan_approve_mode` are global-only (prevents malicious repos from hijacking agent commands, redirecting share requests, or weakening Claude Code permissions)", "12. **Headless CLI comment** — `crit comment` writes directly to the review file without starting the server; SSE notifies any running server"]}]}, "docs/story-mode.md": {"total": 272, "segs": [{"s": 12, "lines": ["## When to use it", "", "Use story mode for branch, PR, MR, or range reviews where the diff is large", "enough that a thematic overview helps. It is diff-scoped only — not for", "positional file reviews, live, preview, or plan reviews.", "", "### Recommended: `/crit-story` skill"]}]}, "internal/session/session.go": {"total": 3115, "segs": [{"s": 129, "lines": ["type Comment struct {", "\tID          string `json:\"id\"`", "\tStartLine   int    `json:\"start_line\"`", "\tEndLine     int    `json:\"end_line\"`", "\tSide        string `json:\"side,omitempty\"`", "\tBody        string `json:\"body\"
