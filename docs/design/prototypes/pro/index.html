${learn([`エージェントが <code>crit</code> を実行してから、人の指摘が stdout で返るまでの${T('oufuku')}（3.1）`,`コードが変わっても、コメントが正しい行に付き続ける仕組み（3.2）`,`${T('story')}を <code>agent_cmd</code> で生成し、検証して取り込む流れ（3.3）`])}
${h2('3.1','レビューの往復（review-cycle）','s3-1')}
${B({id:'b_k3f9a2cq',d:'L1',s:['internal/daemon/daemon.go',174,193],en:true},`<p>エージェントは <code>crit</code> を<b>バックグラウンドで</b>実行し、終わるのを待つだけでよい。client は、同じ作業ディレクトリと branch の${T('jouchuu')}が生きていればそれにつなぎ、いなければ起動する。どの daemon を使うかは${T('sesshon')}、つまり <code>sha256(cwd + "\\0" + branch)</code> の先頭 12 桁で決まる（ファイルを指定したときは branch の代わりに引数を使う）。${C('internal/daemon/daemon.go',174,193)}</p>`)}
${B({id:'b_w1h9y4ke',d:'L1',k:'why',c:'i',s:['cmd/crit/integrations.go',555,572]},`<div class="callout why"><div class="ch"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3"/><path d="M6.4 6.3a1.7 1.7 0 113 1.1c-.6.4-1.4.8-1.4 1.6M8 11.3v.1"/></svg>なぜ HTTP で待ち続けるのか ${INF()}<span class="src mono">根拠: 統合先 14 種 · README の手順</span></div><p>エージェント側に必要なのは「コマンドを 1 本バックグラウンドで走らせ、終わったら stdout を読む」ことだけになる。MCP やソケットをエージェントごとに実装しなくても、14 種のエージェントで同じ手順が使える。${C('cmd/crit/integrations.go',555,572)}</p></div>`)}
${B({id:'b_m4x7q2na',d:'L1',k:'diagram',s:['internal/server/server.go',2660,2727]},`<figure class="figure" style="margin:0"><figcaption><span>sequence · 1 往復</span><span class="mono">矢印をクリックで出典へ</span></figcaption>${SEQSVG()}</figure>`)}
${B({id:'b_r8t2w5zd',d:'L1',k:'list',s:['internal/daemon/client.go',124,154]},`<ol class="steps">
<li>client は daemon の準備ができるまで <code>GET /api/session</code> を <b>500 ms ごと</b>に呼ぶ。準備中の daemon はどの API にも 503 を返し、5 分たっても準備できなければ client は失敗する。${C('internal/daemon/client.go',124,154)}${C('internal/server/server.go',359,368)}</li>
<li>準備ができたら <code>POST /api/review-cycle</code> を送り、そのまま<b>最長 24 時間</b>待つ（HTTP client の timeout）。これが${T('longpoll')}である。${C('internal/daemon/client.go',25,37)}</li>
<li>人はブラウザでコメントを書き、Finish を押す。ブラウザへの更新は SSE（<code>/api/events</code>）で届く。接続直後に 1 byte（<code>:\\n\\n</code>）を送るのは、Safari が最初の body を見るまで <code>onopen</code> を発火しないため。${C('internal/server/server.go',2769,2776)}</li>
<li>daemon は <code>finish</code> を受け取ると、指示文・承認の有無・次に打つコマンド（<code>next_command</code>）を返す。${C('internal/server/server.go',2681,2711)}</li>
<li>client は stderr に <code>approved: …</code>、stdout に指示文を出して終わる。エージェントは指示どおりに直し、<code>next_command</code> を再び実行する。${C('internal/daemon/client.go',63,66)}</li></ol>`)}
${B({id:'b_d3e7p0vu',d:'L3',k:'deepdive',s:['internal/server/server.go',2668,2676]},`<details class="deep"><summary><svg class="ic chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg>Deep Dive: finish を取りこぼさない順序 <span class="l3">L3</span><span class="rt">約 1 分</span></summary><div class="dbody"><p><code>handleReviewCycle</code> は、round-complete を通知する<b>前に</b> <code>Subscribe</code> する。逆の順にすると、通知してから購読するまでの短い間に人が Finish を押した場合、その <code>finish</code> イベントを受け取れず、client は 24 時間の timeout まで待ち続ける。${C('internal/server/server.go',2668,2676)}${C('internal/daemon/client.go',26,26)}</p></div></details>`)}
${B({id:'b_p6f2k8ja',d:'L2',k:'pitfall',s:['internal/server/server.go',2714,2723]},`<div class="callout pit"><div class="ch"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.2l6 10.6H2z"/><path d="M8 6.6v3M8 11.3v.1"/></svg>落とし穴</div><p>daemon が先に終了したときは、HTTP 503 と <code>approved: false</code> が<b>明示的に</b>返る。自前の client を書くときに、接続エラーを「指摘なし＝承認」と扱わないこと。${C('internal/server/server.go',2714,2723)}</p></div>`)}
${h2('3.2','コメントの持ち越し（carry-forward）','s3-2')}
${B({id:'b_c9r4m1xs',d:'L1',s:['internal/session/watch.go',532,565]},`<p>エージェントが直して <code>crit</code> を再実行すると往復が 1 つ進み、未解決のコメントは新しい本文の行へ${T('mochikoshi')}される。コメントは消えない。位置が分からなくなったものも「${T('zure')}」の印を付けて残る。${C('internal/session/watch.go',532,565)}</p>`)}
${B({id:'b_s2l8v6qb',d:'L2',k:'list',s:['internal/session/watch.go',966,995]},`<ol class="steps">
<li>旧本文と新本文の行 diff を Hirschberg 法で取り、旧行 → 新行の対応表を作る。${C('internal/diff/diff.go',33,46)}${C('internal/diff/diff.go',192,200)}</li>
<li>コメントの開始・終了行を対応表で写す。対応の無い行は元の位置のまま、<code>[1, 最終行]</code> に収める。${C('internal/session/watch.go',1098,1125)}</li>
<li>写した先の行が、作成時に保存した${T('anchor')}文字列と一致するか確かめる。一致しなくても、前後の空白を除いて同じ／短い方が <b>8 文字以上</b>で長い方に含まれる／中央の 1 か所だけが削られた／<b>Levenshtein 比 0.7 以上</b>のどれかなら同じ行とみなす。${C('internal/session/watch.go',970,985)}${C('internal/session/watch.go',1001,1027)}</li>
<li>それでも合わなければ、ファイル全体からアンカーを完全一致で探し、写した位置に最も近いものを採る。${C('internal/session/watch.go',925,958)}</li>
<li>どこにも無ければ <code>drifted</code> を立て、位置は LCS の推定のまま残す。${C('internal/session/watch.go',987,994)}</li></ol>`)}
${B({id:'b_f7n3b0ye',d:'L2',c:'i',s:['internal/session/watch.go',320,326]},`<p>変更の検出は、git mode では <b>1 秒ごと</b>の <code>git status --porcelain</code>、files mode ではファイルの mtime の polling で行う。${C('internal/session/watch.go',320,326)} OS のファイル監視（FSEvents・inotify）を使わないのは、3 つの OS で同じ挙動を保つためと考えられる。${INF()}</p>`)}
${B({id:'b_h5j1d9wt',d:'L3',k:'deepdive',s:['internal/diff/diff.go',33,46]},`<details class="deep"><summary><svg class="ic chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg>Deep Dive: 持ち越しの計算量 <span class="l3">L3</span><span class="rt">約 1 分</span></summary><div class="dbody"><p>Hirschberg 法は O(N·M) 時間・O(N) 空間。10k 行の plan で diff が 258 ms、50 コメントの持ち越しまで含めて 393 ms かかった（research 01 §1.6 の実測）。大きな plan が複数あると線形に積み上がる。${C('internal/diff/diff.go',33,46)}</p></div></details>`)}
${h2('3.3','story の生成（agent_cmd）','s3-3')}
${B({id:'b_g4u8c2ro',d:'L1',s:['cmd/crit/cli_handlers_story.go',586,600]},`<p><code>crit story</code> は差分を${T('story')}（テーマごとの章立て）に編集する。diff の全文は一時ファイルに書き、エージェントにはそのパスを含む指示文だけを渡す（prompt-by-reference）。起動するのは ${T('globalonly')}の <code>agent_cmd</code>（例: <code>claude -p</code>）で、1 回の起動には <b>5 分</b>の期限がある。${C('cmd/crit/cli_handlers_story.go',586,600)}${C('cmd/crit/cli_handlers_story.go',690,690)}</p>`)}
${B({id:'b_q7m2xk4d',d:'L2',s:['cmd/crit/cli_handlers_story.go',629,659],en:true},`<p class="tgt">エージェントの出力が story の JSON として読めないときは、パースエラーを添えて<b>正確に 1 回だけ</b>再試行する。2 回目も失敗したら、生の出力を一時ファイルに保存し、終了コード 1 で終わる。${C('cmd/crit/cli_handlers_story.go',629,659)}</p>`)}
${B({id:'b_i3z6t1pc',d:'L2',s:['internal/story/ingest.go',112,170]},`<p>取り込み（ingest）は、${T('shimon')}による drift → 重複 → 配置率 の順に検査する。配置された hunk が <b>50% 未満</b>なら幻覚か drift とみなして拒否し、50% 以上なら欠けた hunk を${T('support')}に <code>auto-repaired</code> として補って保存する。${C('internal/story/ingest.go',25,28)}${C('internal/story/ingest.go',112,170)}</p>`)}
${B({id:'b_y8a5e3lm',d:'L2',k:'why',s:['integrations/prompts/on_story_generate.md',30,32]},`<div class="callout why"><div class="ch"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3"/><path d="M6.4 6.3a1.7 1.7 0 113 1.1c-.6.4-1.4.8-1.4 1.6M8 11.3v.1"/></svg>なぜ出力を hunk の ID 参照だけにするのか<span class="src mono">根拠: stock prompt 原則 7</span></div><p>指示文は hunk を <code>(file_path, old_start)</code> の組だけで参照させ、diff の再引用を禁じている。出力が hunk 数に比例する小さな JSON に収まり、出力単価の高いモデルでも安く済む。${C('integrations/prompts/on_story_generate.md',30,32)}</p></div>`)}
${B({id:'b_n0q4s7vf',d:'L2',k:'pitfall',s:['cmd/crit/cli_handlers_story.go',684,700]},`<div class="callout pit"><div class="ch"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.2l6 10.6H2z"/><path d="M8 6.6v3M8 11.3v.1"/></svg>落とし穴</div><p><code>agent_cmd</code> は <code>strings.Fields</code> で空白区切りに分けられ、引用符は解釈されない。<code>--append-system-prompt "a b"</code> のように空白を含む引数は壊れる。${C('cmd/crit/cli_handlers_story.go',684,700)}${C('internal/server/server.go',3228,3233)}</p></div>`)}
${B({id:'b_t6b2o9kh',d:'L3',k:'deepdive',s:['internal/story/ingest.go',122,126]},`<details class="deep"><summary><svg class="ic chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg>Deep Dive: drift 検査が働かない経路 <span class="l3">L3</span><span class="rt">約 1 分</span></summary><div class="dbody"><p>drift 検査は <code>ScopeFingerprint != ""</code> のときだけ動く。推奨経路（<code>--story-file</code>）では指紋が刻印されないまま保存されるため、実際には検査されない（research 01 §3.8 で再現）。${C('internal/story/ingest.go',122,126)}</p></div></details>`)}
${B({id:'b_e1w7r3gu',d:'L1',k:'recap',s:['internal/server/server.go',2660,2727]},`<div class="callout recap"><div class="ch">まとめ</div><ul><li>往復は「バックグラウンド実行 → 24 時間の${T('longpoll')} → stdout に指示文」の 3 点で、どのエージェントでも動く。</li><li>コメントは行 diff とアンカー照合で持ち越され、見つからなくても消えない。</li><li>story は ID 参照だけで出力させ、検証と補修は crit 側の決定的なコードが行う。</li></ul></div>`)}

const GO_KW = new Set('break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var nil true false'.split(' '));
const GO_TY = new Set('string int int64 bool error byte rune float64 any uint8 uint64 Config Session Story Comment'.split(' '));
function hlGo(s, st) {
  let out = '', last = 0;
  if (st.raw) { const k = s.indexOf('`'); if (k < 0) return `<span class="tk-str">${esc(s)}</span>`; out = `<span class="tk-str">${esc(s.slice(0, k + 1))}</span>`; s = s.slice(k + 1); st.raw = false; }
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(`[^`]*`?)|('(?:[^'\\]|\\.)')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)(?=\s*\()|([A-Za-z_]\w*)/g;
  let m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    const tok = m[0];
    if (m[1]) out += `<span class="tk-com">${esc(tok)}</span>`;
    else if (m[3]) { if (tok.length === 1 || !tok.endsWith('`')) st.raw = true; out += `<span class="tk-str">${esc(tok)}</span>`; }
    else if (m[2] || m[4]) out += `<span class="tk-str">${esc(tok)}</span>`;
    else if (m[5]) out += `<span class="tk-num">${tok}</span>`;
    else if (m[6]) out += GO_KW.has(tok) ? `<span class="tk-kw">${tok}</span>` : `<span class="tk-fn">${tok}</span>`;
    else out += GO_KW.has(tok) ? `<span class="tk-kw">${tok}</span>` : GO_TY.has(tok) ? `<span class="tk-ty">${tok}</span>` : tok;
    last = re.lastIndex;
  }
  return out + esc(s.slice(last));
}
function hlMd(s) {
  if (/^#{1,6}\s/.test(s)) return `<span class="tk-h">${esc(s)}</span>`;
  return esc(s).replace(/`([^`]+)`/g, '<span class="tk-str">`$1`</span>').replace(/\*\*([^*]+)\*\*/g, '<span class="tk-h">**$1**</span>');
}
function hlMake(s) {
  if (/^\s*#/.test(s)) return `<span class="tk-com">${esc(s)}</span>`;
  if (/^[a-z][\w-]*:/.test(s)) { const i = s.indexOf(':'); return `<span class="tk-fn">${esc(s.slice(0, i))}</span>${esc(s.slice(i))}`; }
  return esc(s).replace(/\$\([^)]*\)/g, x => `<span class="tk-ty">${x}</span>`);
}

const AFTER = {};
function buildAfter() {
  PATCH.forEach(f => {
    const src = CODE[f.path]; if (!src) return;
    const segs = src.segs.map(sg => ({ s: sg.s, lines: sg.lines.slice() }));
    const out = [];
    let shift = 0;
    segs.forEach(sg => {
      const hs = f.hunks.filter(h => h.o >= sg.s && h.o < sg.s + sg.lines.length);
      if (!hs.length) { out.push({ s: sg.s + shift, lines: sg.lines, no: sg.lines.map((_, i) => sg.s + shift + i) }); return; }
      const lines = [], marks = [], nos = []; let oi = sg.s, ni = sg.s + shift;
      hs.forEach(h => {
        while (oi < h.o) { lines.push(sg.lines[oi - sg.s]); marks.push(''); nos.push(ni); oi++; ni++; }
        h.L.forEach(([k, s]) => { if (k === '-') { oi++; return; } lines.push(s); marks.push(k === '+' ? 'add' : ''); nos.push(ni); ni++; if (k === ' ') oi++; });
      });
      while (oi < sg.s + sg.lines.length) { lines.push(sg.lines[oi - sg.s]); marks.push(''); nos.push(ni); oi++; ni++; }
      shift = ni - oi;
      out.push({ s: nos[0], lines, mark: marks, no: nos });
    });
    AFTER[f.path] = { total: src.total + (f.add - f.del), segs: out };
  });
}

    case 'batch': return batchSend();
    case 'openblock': return ibOpen();
    case 'sendone': { const x = ibOrdered()[S.ibSel]; if (x) { x.st = 'running'; renderInbox(); renderSideBody(); later(4500, () => { x.st = 'answered'; x.co = '$0.005'; renderInbox(); renderSideBody(); renderTop(); }); } return; }
    case 'retry': { const x = ibOrdered()[S.ibSel]; if (x) { x.st = 'running'; x.co = '≈$0.09'; renderInbox(); renderSideBody(); toast({ html: 'claude-opus-5-5（effort high）で提案のみを依頼しました <span class="tm">確認済 · 上限 $0.15</span>', ms: 3000 }); } return; }
    case 'resolve': { const card = el.closest('.thread'); if (card) { card.outerHTML = `<div class="thread th-collapsed" style="box-shadow:none;border-style:dashed"><div class="th-h" style="border:0">${stateChip('resolved')}<span>解決しました</span></div></div>`; } return; }
    case 'promote': return toast({ html: '回答を Deep Dive ブロックとして文書に追記しました <span class="tm">提案モード · origin: human-approved</span>', ms: 2600 });
    case 'regen': return toast({ html: `§${S.chap} の再生成をキューに入れました <span class="tm">≈5k tok · claude-sonnet-5-5 · 人の編集と確認済は保持（3-way）</span>`, ms: 3000 });
    case 'copymd': copyText('## …'); return toast({ html: 'Markdown としてコピー <span class="tm">block ID コメント付き</span>', ms: 2000 });
    case 'translate': return translateBlocks();
    case 'addctx': return toast({ html: '@ で追加: <code>cli_handlers_story_llm_test.go</code> · <code>internal/story/prompt.go</code> · <code>§6.5</code>', ms: 2600 });
    case 'followup': return toast({ html: 'この提案に続けて依頼（--resume · 増分 ≈1k tok）', ms: 2200 });
    case 'sendnote': { const id = el.dataset.th; const x = S.threads.find(y => y.id === id); if (x) x.st = 'running'; el.closest('.thread').querySelector('.th-act').innerHTML = '<span class="state running"><span class="spin"></span>送信済み · 回答待ち</span>'; return; }
    case 'reply': return toast({ html: '返信は Composer で（c）', ms: 1800 });
    case 'ask': return toast({ html: '専門家に確認を依頼しました <span class="tm">Inbox の「確認依頼」に入ります</span>', ms: 2200 });
    case 'scrolldoc': { e.preventDefault(); const b = document.getElementById('b_q7m2xk4d'); if (b) b.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' }); return; }
    case 'retryjob': return toast({ html: '再試行しました', ms: 1500 });
  }
}

/* ---------------------------------------------------------------- boot (hash states for review & screenshots) */
function boot() {
  buildAfter();
  document.documentElement.lang = S.lang;
  $$('.modk').forEach(k => k.textContent = MODK + 'K');
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $('#app').classList.remove('lvl-newcomer', 'lvl-standard', 'lvl-expert'); $('#app').classList.add('lvl-' + S.level);
  if (saved.rail === false) $('#app').classList.add('no-rail');
  const st = HP.get('state') || 'doc';
  if (st === 'scan') { S.gen = 'idle'; }
  else {
    S.gen = 'done';
    S.jobs.push({ id: 'th_16', kind: 'explain', title: 'Subscribe を round-complete より先に呼ぶのはなぜ？', body: 'Subscribe を round-complete より先に呼ぶのはなぜ？ 逆だと何が起きる？', state: 'running', stage: 3, t0: performance.now() - 3400 / SPEED, detail: '回答を stream 中 · claude-sonnet-5-5', est: '≈1.6k · $0.006', chap: '3', block: 'b_d3e7p0vu', node: 'server', stream: ANSWERS.b_d3e7p0vu.slice(0, 86) });
    S.jobs.push({ id: 'gen_01', kind: 'gen', title: '設計書を生成 · 標準', state: 'done', detail: '入力 0.38M（キャッシュ 0.19M）· 出力 52k · $1.21 · 5分48秒', cost: '$1.21' });
    S.usage = { tok: 18400 + 432000, usd: 1.33, h5: 33, d7: 44 };
  }
  bind();
  const view = st === 'scan' ? 'map' : st === 'inbox' ? 'inbox' : st === 'map' ? 'map' : 'doc';
  go(view, HP.get('chap') || '3');
  renderStatus();
  if (st === 'doc') { const b = document.getElementById('b_r8t2w5zd'); if (b) setTimeout(() => setSpied(b), 50); }
  if (['composer', 'running', 'ready', 'accepted'].includes(st)) {
    const b = document.getElementById('b_q7m2xk4d'); b.scrollIntoView({ block: 'center' });
    const p = b.querySelector('p'); const tn = [...p.childNodes].find(n => n.nodeType === 1 && n.tagName === 'B');
    if (tn) { const r = document.createRange(); r.selectNodeContents(tn); getSelection().removeAllRanges(); getSelection().addRange(r); checkSelection(); }
    openComposer('f', b);
    if (st !== 'composer') { S.composer.body = '再試行回数を設定で変えられるようにしたい。既定は今と同じ 1 回、上限 3 回。repo の設定からは変えられないように（global のみ）。'; submitComposer(); }
    if (st === 'ready' || st === 'accepted') { const j = S.jobs[0]; j.ff = true; j.stage = FIX_STAGES.length - 1; j.state = 'ready'; j.t0 = performance.now() - 14200; onReady(j); updateJobCard(j); if (st === 'accepted') acceptReview(); }
  }
  if (st === 'palette') openPalette(HP.get('q') || 'mochi');
  if (st === 'help') openHelp();
  if (HP.get('peek')) { const c = $$('#doc .cite')[+HP.get('peek')]; if (c) setTimeout(() => showPeek(c), 200); }
  // background explain job finishes later (realistic queue movement)
  const j16 = S.jobs.find(x => x.id === 'th_16');
  if (j16) { const full = ANSWERS.b_d3e7p0vu, t1 = performance.now(); const iv = setInterval(() => { if (j16.state !== 'running') return clearInterval(iv); let s = full.slice(0, Math.min(full.length, 86 + Math.floor((performance.now() - t1) * SPEED / 1000 * 9))); const lt = s.lastIndexOf('<'), gt = s.lastIndexOf('>'); if (lt > gt) s = s.slice(0, lt); j16.stream = s; updateJobCard(j16); }, 250); later(14000, () => { if (j16.state !== 'running') return; j16.state = 'done'; j16.answer = full; updateJobCard(j16); onAnswered(j16); }); }
}
boot();
